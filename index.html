// DOCX-TO-JSON VOCABULARY PARSER (text-based fallback)
// ═══════════════════════════════════════════
function parseDocxToVocabJSON(rawText){
  // Step 1: Clean raw text
  let text=rawText.replace(/\s+/g,' ').trim();
  text=text.replace(/[-=]{3,}/g,' ').replace(/\|+/g,' ');
  // Step 2: Split into entries by word + POS pattern
  const entryRegex=/\b([a-z]+)\s*\((verb|noun|adj|adv|adjective|noun,\s*verb|verb,\s*noun)\)\s*/gi;
  const entries=[];
  const matches=[...text.matchAll(entryRegex)];
  for(let i=0;i<matches.length;i++){
    const start=matches[i].index;
    const end=i<matches.length-1?matches[i+1].index:text.length;
    entries.push(text.slice(start,end));
  }
  // Step 3: Parse each entry
  const results=[];
  for(const body of entries){
    const card=parseVocabEntry(body);
    if(card&&card.word)results.push(card);
  }
  return results;
}
function parseVocabEntry(body){
  // Extract word and POS
  const wordMatch=body.match(/^([a-z]+)\s*\((verb|noun|adj|adv|adjective|noun,\s*verb|verb,\s*noun)\)/i);
  if(!wordMatch)return null;
  const word=wordMatch[1].toLowerCase();
  const pos=wordMatch[2].toLowerCase().replace(/,\s*\w+/g,'');
  // Split body into sections using labeled markers
  const secParts=body.split(/(Example\s*\/\s*Usage|Context\s*\/\s*Collocation|Note\s*\/\s*Trap)/);
  const before=secParts[0]||'';
  const sections={};
  for(let i=1;i<secParts.length;i+=2){
    const label=secParts[i];
    const content=(secParts[i+1]||'').trim();
    if(label==='Example / Usage')sections.example=content;
    else if(label==='Context / Collocation')sections.context=content;
    else if(label==='Note / Trap')sections.note=content;
  }
  // Extract pronunciation (phonetic text after POS, before Also:)
  const pronMatch=before.match(/\)\s*([A-Z][A-Za-z\- ]+?)(?:\s*Also:)/);
  const pronunciation=pronMatch?pronMatch[1].trim():'';
  // Extract "Also:" derived forms
  const alsoMatch=before.match(/Also:\s*(.+?)(?=\s*Example|\s*Context|\s*Note|$)/i);
  const wordFamilyRaw=alsoMatch?alsoMatch[1]:'';
  const wordFamily=wordFamilyRaw.split(/,\s*|also/i).map(s=>s.trim()).filter(s=>s.length>1&&s.length<60&&/^[a-z]/i.test(s));
  // Extract Persian translation (Persian/Arabic characters)
  const persianMatch=before.match(/([\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF][\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF\u0020\u060C\u061B\u061F\u0640\u064B-\u065F\u0670\u06D6-\u06DC\u06DF-\u06E4\u06E7\u06E8\u06EA-\u06ED\u200C\u200D\u200E\u200F\uFEFF\u0610-\u061A\u064D\u0671-\u0677\u0679-\u0685\u0687-\u0691\u0693-\u0695\u0697-\u06A8\u06AA-\u06BF\u06C1-\u06CF\u06D1-\u06D5\u06D7-\u06ED\u06F0-\u06F9\u06FA-\u06FF]+[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]*)/);
  const translation=persianMatch?persianMatch[1].trim():'';
  // Extract core definition (English text between Also: section end and Persian, or after Persian before Example)
  let coreMeaning='';
  const persIdx=persianMatch?before.indexOf(persianMatch[0]):-1;
  const alsoIdx=alsoMatch?before.indexOf(alsoMatch[0])+alsoMatch[0].length:-1;
  if(persIdx>alsoIdx&&alsoIdx>0){
    coreMeaning=before.slice(alsoIdx,persIdx).replace(/[\u0600-\u06FF\u0750-\u077F\uFB50-\uFDFF\uFE70-\uFEFF]+/g,'').trim();
  }
  // Extract Example/Usage
  let examples=[];
  if(sections.example){
    examples=sections.example.split(/(?:\.?\s*\/\s*(?=[A-Z])|(?<=[.!?])\s+(?=[A-Z]))/).map(s=>s.trim()).filter(s=>s.length>10&&s.length<300);
    if(!examples.length&&sections.example.length>10)examples=[sections.example.trim()];
  }
  // Extract Context/Collocation
  let context='';
  let collocations=[];
  if(sections.context){
    context=sections.context.trim();
    collocations=context.split(/[;,]/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<80);
  }
  // Extract Note/Trap
  let note='';let trap='';
  if(sections.note){
    const noteText=sections.note.trim();
    const trapMatch=noteText.match(/Trap\s*:?\s*(.+)/i);
    if(trapMatch){trap=trapMatch[1].trim();note=noteText.replace(/Trap\s*:?\s*.*/i,'').replace(/Note\s*:?\s*/i,'').trim()}
    else{note=noteText.replace(/Note\s*:?\s*/i,'').trim()}
  }
  // Extract synonyms and antonyms from the tone/synonym section
  let synonyms=[];
  let antonyms=[];
  // Look for pattern: English words after tone description, before Example
  const toneAndSyn=before.split(/Example\s*\/\s*Usage/i)[0]||'';
  // Find the last Persian sentence end (period after tone description)
  const lastPersianEnd=toneAndSyn.lastIndexOf('.');
  if(lastPersianEnd>0){
    const afterTone=toneAndSyn.slice(lastPersianEnd+1).trim();
    const engList=afterTone.match(/^[a-z][\w\s,.-]+$/i);
    if(engList){
      // Split by comma or semicolon
      const words=engList[0].split(/,\s*/).map(s=>s.trim()).filter(s=>s.length>1&&s.length<30&&/^[a-z]/i.test(s));
      // The list typically has: synonyms, antonyms, IELTS-eq
      // Try to split into 3 groups
      if(words.length>=6){
        synonyms=words.slice(0,Math.ceil(words.length/3));
        antonyms=words.slice(Math.ceil(words.length/3),Math.ceil(words.length*2/3));
      }else if(words.length>=3){
        synonyms=words.slice(0,Math.ceil(words.length/2));
        antonyms=words.slice(Math.ceil(words.length/2));
      }else{
        synonyms=words;
      }
    }
  }
  // Build card
  return{
    id:uid()+'_'+word.replace(/[^a-z0-9]/g,''),
    word:word,
    translation:translation,
    ipa:pronunciation,
    partOfSpeech:pos,
    coreMeaning:coreMeaning,
    definitions:coreMeaning?[coreMeaning]:[],
    examples:examples.slice(0,3),
    context:context.slice(0,300),
    collocations:collocations.slice(0,5),
    synonyms:synonyms.slice(0,6),
    antonyms:antonyms.slice(0,6),
    wordFamily:wordFamily.slice(0,5),
    note:note.slice(0,500),
    trap:trap.slice(0,500),
    category:'پیش‌فرض',
    tags:['gre','manhattan-500'],
    source:'manhattan-500',
    box:0,repetitions:0,interval:1,easeFactor:2.5,
    addedDate:new Date().toISOString(),nextReviewDate:null,lastReviewedAt:null,
    stability:0,difficulty:0,elapsedDays:0,scheduledDays:0,
    reps:0,lapses:0,fsrsState:'new',favorite:false
  };
}

async function extractPdfTextPages(file){
  await ensurePdfJs();
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){

    const tc=await page.getTextContent();
    pages.push({pageNum:i,text:tc.items.map(x=>x.str).join(' '),items:tc.items});

  return{pdf,pages};
}

    if(ipaText)html+='<span style="font-size:.85rem;color:var(--text2)">'+esc(ipaText)+'</span>';

    html+='<button type="button" class="trans-audio-btn" data-speak="'+esc(displayWord)+'" title="Listen">🔊</button>';
    html+='</div>';

// ── Translation Cache ──────────────────────
function getCachedTrans(word){
  const key=normalizeWordLookup(word);
  return readingTransCache[key]||null;
}
function cacheTrans(word,data){
  const key=normalizeWordLookup(word);
  readingTransCache[key]=data;
}
async function translateBatch(words){
  const unique=[...new Set(words.map(w=>normalizeWordLookup(w)).filter(w=>w&&w.length>=2))];
  const toTranslate=unique.filter(w=>!readingTransCache[w]);
  for(let i=0;i<toTranslate.length;i+=5){
    const batch=toTranslate.slice(i,i+5);
    const results=await Promise.all(batch.map(async w=>{
      try{
        const [trans,dict]=await Promise.all([fetchTranslation(w),fetchDictionary(w)]);
        const data={translation:trans||'',ipa:'',pos:'',definitions:[],examples:[],synonyms:[],audioUs:'',audioBr:''};
        if(dict){
          data.ipa=dict.phoneticBr||dict.phoneticUs||dict.phonetic||'';
          data.pos=dict.meanings[0]?dict.meanings[0].partOfSpeech:'';
          data.definitions=dict.meanings.flatMap(m=>m.definitions).slice(0,4);
          data.examples=dict.meanings.flatMap(m=>m.examples).slice(0,3);
          data.synonyms=dict.meanings.flatMap(m=>m.synonyms).slice(0,5);
          data.audioUs=dict.audioUs||'';
          data.audioBr=dict.audioBr||'';
        }
        return data;
      }catch(e){return{translation:'',ipa:'',pos:'',definitions:[],examples:[],synonyms:[],audioUs:'',audioBr:''}}
    }));
    batch.forEach((w,i)=>{readingTransCache[w]=results[i]});
  }
}

// ── Document Model Builder ─────────────────
function buildReadingDoc(pages,title,sourceType){
  const doc={id:uid(),title,sourceType,pages:[],rawText:'',totalPages:pages.length,totalWords:0,uniqueWords:0,occurrences:{},avgWordsPerPage:0,sentenceCount:0,paragraphCount:0,longestWords:[],mostFrequentWords:[],readingDifficulty:'متوسط',pageStats:[]};
  const allWords=[];const allNormalized=[];
  pages.forEach((p,pi)=>{
    const words=p.text.split(/(\s+)/).filter(w=>w.trim());
    const engWords=words.map(w=>normalizeWordLookup(w)).filter(w=>w&&w.length>=2);
    const normalized=engWords;
    allWords.push(...engWords);allNormalized.push(...normalized);
    const unique=[...new Set(normalized)];
    const pageOcc={};
    normalized.forEach(w=>{pageOcc[w]=(pageOcc[w]||0)+1});
    const topWords=Object.entries(pageOcc).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([word,count])=>({word,count}));
    doc.pages.push({pageNumber:pi+1,text:p.text,words:engWords,totalWords:engWords.length,uniqueWords:unique.length,topWords});
  });
  doc.rawText=pages.map(p=>p.text).join('\n\n');
  doc.occurrences={};
  allNormalized.forEach(w=>{if(!doc.occurrences[w])doc.occurrences[w]={count:0,pages:[]};doc.occurrences[w].count++});
  doc.pages.forEach((p,pi)=>{
    const pageNorm=p.text.split(/(\s+)/).filter(w=>w.trim()).map(w=>normalizeWordLookup(w)).filter(w=>w&&w.length>=2);
    [...new Set(pageNorm)].forEach(w=>{if(doc.occurrences[w]&&!doc.occurrences[w].pages.includes(pi+1))doc.occurrences[w].pages.push(pi+1)});
  });
  doc.totalWords=allNormalized.length;
  doc.uniqueWords=[...new Set(allNormalized)].length;
  doc.avgWordsPerPage=doc.totalPages?Math.round(doc.totalWords/doc.totalPages):0;
  doc.sentenceCount=(doc.rawText.match(/[.!?]+/g)||[]).length;
  doc.paragraphCount=doc.rawText.split(/\n\s*\n/).filter(p=>p.trim()).length;
  const sorted=Object.entries(doc.occurrences).sort((a,b)=>b[1].count-a[1].count);
  doc.mostFrequentWords=sorted.slice(0,20).map(([word,o])=>({word,count:o.count,pages:o.pages}));
  doc.longestWords=[...new Set(allNormalized)].sort((a,b)=>b.length-a.length).slice(0,15);
  const complexWords=[...new Set(allNormalized)].filter(w=>w.length>7&&!FREQ_T1.has(w)&&!FREQ_T2.has(w)).length;
  const uniqueAll=[...new Set(allNormalized)];const complexRatio=uniqueAll.length?complexWords/uniqueAll.length:0;
  doc.readingDifficulty=complexRatio>0.3?'سخت':complexRatio>0.15?'متوسط':'آسان';
  doc.pageStats=doc.pages.map(p=>{
    const pNorm=p.text.split(/(\s+)/).filter(w=>w.trim()).map(w=>normalizeWordLookup(w)).filter(w=>w&&w.length>=2);
    const pOcc={};pNorm.forEach(w=>{pOcc[w]=(pOcc[w]||0)+1});
    return{pageNumber:p.pageNumber,totalWords:p.totalWords,uniqueWords:p.uniqueWords,topWords:Object.entries(pOcc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([w,c])=>({word:w,count:c}))};
  });
  return doc;
}

// ── File Extraction ────────────────────────
async function extractPDFForReading(file){
  await ensurePdfJs();
  toast('در حال استخراج متن PDF...','info');
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc||pdfjsLib.GlobalWorkerOptions.workerSrc.includes('cdnjs')){
    try{const wr=await fetch('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js');const wb=await wr.blob();pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(wb)}catch(x){pdfjsLib.GlobalWorkerOptions.workerSrc=''}
  }
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf,disableFontFace:false,useSystemFonts:true,cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',cMapPacked:true}).promise;
  const pages=[];
  for(let i=1;i<=pdf.numPages;i++){
    const p=await pdf.getPage(i);
    const tc=await p.getTextContent();
    pages.push({text:tc.items.map(x=>x.str).join(' ')});
    if(i%5===0)await new Promise(r=>setTimeout(r,0));
  }
  return pages;
}
function extractTXTForReading(text,charsPerPage){
  charsPerPage=charsPerPage||3000;
  const pages=[];let remaining=text;
  while(remaining.length>0){
    let cut=remaining.lastIndexOf('\n\n',charsPerPage);
    if(cut<charsPerPage*0.3)cut=remaining.lastIndexOf('. ',charsPerPage);
    if(cut<charsPerPage*0.3)cut=charsPerPage;
    else cut+=2;
    pages.push({text:remaining.slice(0,cut).trim()});
    remaining=remaining.slice(cut).trim();
  }
  return pages.length?pages:[{text:text||''}];
}

function renderReadingPageContent(page,doc){
  const words=page.text.split(/(\s+)/);
  let searchLower=readingSearchQuery.toLowerCase();
  return words.map(w=>{
    if(!w.trim())return w;
    const nw=normalizeWordLookup(w);
    if(!nw||nw.length<2)return esc(w);
    const exists=S.words.some(x=>x.word.toLowerCase()===nw)||S.longTerm.some(x=>x.word.toLowerCase()===nw);
    const occ=doc.occurrences[nw];
    const isUnknown=!exists;
    const isRepeated=occ&&occ.count>2;
    const isSearch=searchLower&&nw.includes(searchLower);
    const isSelected=readingSelectedWords.has(nw);
    let cls='reading-word';
    if(isUnknown)cls+=' unknown';
    if(isRepeated)cls+=' repeated';
    if(isSearch)cls+=' search-match';
    if(isSelected)cls+=' selected-word';
    if(exists)cls+=' known';
    const title=occ?nw+' ('+occ.count+'x)':nw;
    return'<span class="'+cls+'" data-word="'+esc(nw)+'" title="'+esc(title)+'">'+esc(w)+'</span>';
  }).join('');
}

async function handleReadingFile(file,c){
  const ext=file.name.split('.').pop().toLowerCase();
  try{
    let pages,title;
    if(ext==='pdf'){
      pages=await extractPDFForReading(file);
      title=file.name;
    }else if(ext==='txt'){
      const text=await file.text();
      pages=extractTXTForReading(text);
      title=file.name;
    }else{toast('فرمت فایل پشتیبانی نمی‌شود','error');return}
    readingDoc=buildReadingDoc(pages,title,ext);
    readingCurrentPage=0;readingViewMode='raw';
    saveReadingSession();renderReading(c);
    toast(file.name+' بارگذاری شد ('+readingDoc.totalPages+' صفحه)','success');
    preloadReadingTranslations();
  }catch(e){toast('خطا در خواندن فایل: '+e.message,'error')}
}

async function preloadReadingTranslations(){
  if(!readingDoc)return;
  const page=readingDoc.pages[readingCurrentPage];
  if(!page)return;
  const words=[...new Set(page.words.map(w=>normalizeWordLookup(w)).filter(w=>w&&w.length>=2))];
  const unknown=words.filter(w=>!readingTransCache[w]&&!S.words.some(x=>x.word.toLowerCase()===w)&&!S.longTerm.some(x=>x.word.toLowerCase()===w));
  if(unknown.length>0)await translateBatch(unknown.slice(0,30));
}

function saveReadingSession(){
  try{if(readingDoc)localStorage.setItem('leitner_reading_session',JSON.stringify({title:readingDoc.title,sourceType:readingDoc.sourceType,page:readingCurrentPage,view:readingViewMode}))}catch(e){}
}

function bindReadingEvents(c,doc){
  var newFileBtn=document.getElementById('rdNewFile');
  if(newFileBtn)newFileBtn.onclick=function(){readingDoc=null;readingText='';readingCurrentPage=0;renderReading(c)};
  var closeBtn=document.getElementById('rdClose');
  if(closeBtn)closeBtn.onclick=function(){readingDoc=null;readingText='';readingCurrentPage=0;renderReading(c)};
  c.querySelectorAll('[data-rmode]').forEach(function(btn){
    btn.onclick=function(){readingViewMode=btn.dataset.rmode;renderReading(c)};
  });
  c.querySelectorAll('[data-rfilter]').forEach(function(btn){
    btn.onclick=function(){readingFilterMode=btn.dataset.rfilter;renderReading(c)};
  });
  var prevBtn=document.getElementById('rdPrevPage');
  if(prevBtn)prevBtn.onclick=function(){if(readingCurrentPage>0){readingCurrentPage--;saveReadingSession();renderReading(c);preloadReadingTranslations()}};
  var nextBtn=document.getElementById('rdNextPage');
  if(nextBtn)nextBtn.onclick=function(){if(readingCurrentPage<doc.totalPages-1){readingCurrentPage++;saveReadingSession();renderReading(c);preloadReadingTranslations()}};
  var searchInput=document.getElementById('rdSearch');
  if(searchInput){var st;searchInput.oninput=function(){clearTimeout(st);st=setTimeout(function(){readingSearchQuery=searchInput.value;renderReading(c)},300)}}

      showReadingWordDetail(word,span,doc);

    item.onclick=function(){readingSearchQuery=item.dataset.vword;readingViewMode='raw';renderReading(c)};
  });
  c.querySelectorAll('[data-hpage]').forEach(function(cell){
    cell.onclick=function(){readingCurrentPage=parseInt(cell.dataset.hpage);readingViewMode='raw';saveReadingSession();renderReading(c);preloadReadingTranslations()};
  });

}

function showBatchAddPanel(doc){
  var unknown=Object.entries(doc.occurrences).filter(function(entry){return !wordExists(entry[0])}).sort(function(a,b){return b[1].count-a[1].count});
  if(!unknown.length){toast('همه کلمات در کتابخانه موجود هستند','info');return}
  var ov=document.createElement('div');ov.className='modal-overlay';
  var selected=new Set(unknown.map(function(e){return e[0]}));
  function renderBatchModal(){
    ov.innerHTML='<div class="modal" style="max-width:560px">'
      +'<h3 style="margin-bottom:12px">📥 افزودن گروهی کلمات ('+selected.size+' انتخاب شده)</h3>'
      +'<p style="color:var(--text2);font-size:.85rem;margin-bottom:12px">کلمات ناشناخته با تکرار بالا. روی کلمات کلیک کنید تا انتخاب/لغو شوند.</p>'
      +'<div style="max-height:400px;overflow-y:auto">'
      +unknown.map(function(entry){
        var w=entry[0],o=entry[1];
        return'<div class="import-word-item'+(selected.has(w)?'':' existing')+'" data-bword="'+esc(w)+'" style="justify-content:space-between">'
          +'<div><strong>'+esc(w)+'</strong> <span style="color:var(--text2);font-size:.78rem">'+o.count+'x — صفحه '+o.pages.join(', ')+'</span></div>'
          +'<input type="checkbox" '+(selected.has(w)?'checked':'')+' data-bcheck="'+esc(w)+'" style="accent-color:var(--accent)"></div>';
      }).join('')
      +'</div>'
      +'<div style="display:flex;gap:8px;margin-top:16px;justify-content:flex-end">'
      +'<button type="button" class="btn btn-ghost" id="batchClose">بستن</button>'
      +'<button type="button" class="btn btn-primary" id="batchAddLeitner">افزودن به لایتنر ('+selected.size+')</button>'
      +'<button type="button" class="btn btn-success" id="batchAddLT" style="font-size:.8rem">افزودن به حافظه بلندمدت ('+selected.size+')</button>'
      +'</div></div>';
    ov.querySelector('#batchClose').onclick=function(){ov.remove()};
    ov.querySelectorAll('[data-bcheck]').forEach(function(cb){
      cb.onchange=function(){var w=cb.dataset.bcheck;if(cb.checked)selected.add(w);else selected.delete(w);renderBatchModal()};
    });
    ov.querySelectorAll('[data-bword]').forEach(function(item){
      item.onclick=function(){var w=item.dataset.bword;if(selected.has(w))selected.delete(w);else selected.add(w);renderBatchModal()};
    });
    ov.querySelector('#batchAddLeitner').onclick=async function(){
      var words=[...selected];
      toast('در حال ترجمه '+words.length+' کلمه...','info');
      await translateBatch(words);
      var added=0;
      words.forEach(function(w){
        if(wordExists(w))return;
        var c2=getCachedTrans(w)||{};
        S.words.push(createCard({word:w,translation:c2.translation||'',ipa:c2.ipa||'',definitions:c2.definitions||[],examples:c2.examples||[],synonyms:c2.synonyms||[],partOfSpeech:c2.pos||'',audioUs:c2.audioUs||'',audioBr:c2.audioBr||'',source:'reading-mode'}))
        added++;
      });
      save();ov.remove();toast(added+' کلمه به لایتنر اضافه شد','success');renderReading(document.getElementById('content'));
    };
    ov.querySelector('#batchAddLT').onclick=async function(){
      var words=[...selected];
      toast('در حال ترجمه '+words.length+' کلمه...','info');
      await translateBatch(words);
      var added=0;
      words.forEach(function(w){
        if(wordExists(w))return;
        var c2=getCachedTrans(w)||{};
        S.longTerm.push(createCard({word:w,translation:c2.translation||'',ipa:c2.ipa||'',definitions:c2.definitions||[],examples:c2.examples||[],synonyms:c2.synonyms||[],partOfSpeech:c2.pos||'',audioUs:c2.audioUs||'',audioBr:c2.audioBr||'',source:'reading-mode'}))
        added++;
      });
      save();ov.remove();toast(added+' کلمه به حافظه بلندمدت اضافه شد','success');renderReading(document.getElementById('content'));
    };
  }
  renderBatchModal();
  document.body.appendChild(ov);
  ov.onclick=function(e){if(e.target===ov)ov.remove()};
}

function exportReadingVocab(doc){
  var vocab=Object.entries(doc.occurrences).sort(function(a,b){return b[1].count-a[1].count}).map(function(entry){
    var word=entry[0],o=entry[1];
    var cached=getCachedTrans(word)||{};
    return{word:word,translation:cached.translation||'',ipa:cached.ipa||'',count:o.count,pages:o.pages,inLeitner:wordExists(word)};
  });
  var blob=new Blob([JSON.stringify(vocab,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download='reading-vocab-'+doc.title.replace(/[^a-z0-9]/gi,'_')+'.json';a.click();URL.revokeObjectURL(url);
  toast(vocab.length+' واژه خروجی گرفته شد','success');
}

function buildHeatmap(totalDays){
  let html='<div class="heatmap">';
  const now=new Date();
  for(let i=totalDays-1;i>=0;i--){
    const d=new Date(now.getTime()-i*MS_PER_DAY);
    const key=d.toISOString().slice(0,10);
    const count=(S.stats.history[key]||{}).reviewed||0;
    const level=count===0?0:count<=2?1:count<=5?2:count<=10?3:4;
    const tooltip=`${key}: ${count} مرور`;
    html+=`<div class="heatmap-cell heatmap-l${level}" data-count="${tooltip}" title="${tooltip}"></div>`;
  }
  html+='</div>';
  return html;
}

function buildForecast(days){
  const labels=[];
  const data=[];
  const now=new Date();
  for(let i=0;i<days;i++){
    const d=new Date(now.getTime()+i*MS_PER_DAY);
    const dateStr=d.toISOString().slice(0,10);
    const dayName=d.toLocaleDateString('fa-IR',{month:'short',day:'numeric'});
    labels.push(dayName);
    const count=S.words.filter(w=>w.nextReviewDate&&w.nextReviewDate.slice(0,10)===dateStr).length;
    data.push(count);
  }
  return{labels,data};
}

// ═══════════════════════════════════════════
function initQuizSession(){
  if(!S.quizStats)S.quizStats={sessions:[],totalCorrect:0,totalWrong:0,wordPerformance:{},currentSession:null};
  if(!S.quizStats.currentSession){
    S.quizStats.currentSession={correct:0,wrong:0,mode:quizMode,startTime:new Date().toISOString(),words:[]};
    save();
  }
}
function finalizeQuizSession(){
  if(!S.quizStats||!S.quizStats.currentSession)return;
  const cs=S.quizStats.currentSession;
  if(cs.correct>0||cs.wrong>0){
    S.quizStats.sessions.push({date:new Date().toISOString(),correct:cs.correct,wrong:cs.wrong,mode:cs.mode,duration:Date.now()-new Date(cs.startTime).getTime()});
    if(S.quizStats.sessions.length>50)S.quizStats.sessions=S.quizStats.sessions.slice(-50);
    S.quizStats.totalCorrect+=cs.correct;
    S.quizStats.totalWrong+=cs.wrong;
  }
  S.quizStats.currentSession=null;
  save();
}
function updateQuizWordPerformance(wordId,isCorrect){
  if(!S.quizStats)return;
  if(!S.quizStats.wordPerformance[wordId])S.quizStats.wordPerformance[wordId]={correct:0,wrong:0,lastSeen:null,streak:0,confusedWith:{}};
  const wp=S.quizStats.wordPerformance[wordId];
  if(isCorrect){wp.correct++;wp.streak=Math.max(0,wp.streak)+1}
  else{wp.wrong++;wp.streak=Math.min(0,wp.streak)-1}
  wp.lastSeen=new Date().toISOString();
}

function recordConfusion(correctId,wrongId){
  if(!S.quizStats||!S.quizStats.wordPerformance)return;
  if(!S.quizStats.wordPerformance[correctId])S.quizStats.wordPerformance[correctId]={correct:0,wrong:0,lastSeen:null,streak:0,confusedWith:{}};
  const cw=S.quizStats.wordPerformance[correctId].confusedWith;
  cw[wrongId]=(cw[wrongId]||0)+1;
}
function getConfusionPartners(wordId){
  if(!S.quizStats||!S.quizStats.wordPerformance||!S.quizStats.wordPerformance[wordId])return[];
  const cw=S.quizStats.wordPerformance[wordId].confusedWith;
  if(!cw)return[];
  return Object.entries(cw).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
}

// ═══════════════════════════════════════════
// SESSION-AWARE SCHEDULING
// ═══════════════════════════════════════════
let _quizSessionWrongCount={}; // wordId -> wrong count in current session
let _quizSessionSkipUntil={};  // wordId -> skip until question N
let _quizQuestionNum=0;

function shouldSkipInSession(wordId){
  const skipUntil=_quizSessionSkipUntil[wordId];
  if(skipUntil&&_quizQuestionNum<skipUntil)return true;
  const wrongCount=_quizSessionWrongCount[wordId]||0;
  if(wrongCount>=3){
    _quizSessionSkipUntil[wordId]=_quizQuestionNum+5; // skip next 5 questions
    return true;
  }
  return false;
}
function recordSessionAnswer(wordId,isCorrect){
  if(!isCorrect){
    _quizSessionWrongCount[wordId]=(_quizSessionWrongCount[wordId]||0)+1;
  }
}

// ═══════════════════════════════════════════
// WORD STRENGTH & ADAPTIVE DIFFICULTY
// ═══════════════════════════════════════════
function getWordStrength(w){
  const stabilityScore=Math.min((w.stability||0)/60,1);
  const quizPerf=S.quizStats&&S.quizStats.wordPerformance?S.quizStats.wordPerformance[w.id]:null;
  let quizScore=0.5;
  if(quizPerf){const total=quizPerf.correct+quizPerf.wrong;if(total>0)quizScore=quizPerf.correct/total}
  const difficultyScore=1-((w.difficulty||0)/10);
  return stabilityScore*0.4+quizScore*0.4+difficultyScore*0.2;
}

// ═══════════════════════════════════════════
// ANSWER HANDLER (FSRS + Persistence)
// ═══════════════════════════════════════════
// Quiz undo state
let _quizUndoState=null;
let _quizUndoTimer=null;

function handleQuizAnswer(isCorrect){
  // Save undo state before applying
  _quizUndoState={
    cardId:quizState.card.id,
    isCorrect:isCorrect,
    quizCorrect:quizCorrect,
    quizWrong:quizWrong,
    quizSessionStreak:quizSessionStreak,
    statsReviewed:S.stats.reviewed,
    statsCorrect:S.stats.correct,
    statsWrong:S.stats.wrong,
    fsrsSnapshot:{stability:quizState.card.stability,difficulty:quizState.card.difficulty,interval:quizState.card.interval,fsrsState:quizState.card.fsrsState,lapses:quizState.card.lapses,reps:quizState.card.reps,nextReviewDate:quizState.card.nextReviewDate,lastReviewedAt:quizState.card.lastReviewedAt,box:quizState.card.box,easeFactor:quizState.card.easeFactor,elapsedDays:quizState.card.elapsedDays,scheduledDays:quizState.card.scheduledDays},
    dk:todayKey(),
    dkHistory:S.stats.history[todayKey()]?{...S.stats.history[todayKey()]}:null
  };

  if(isCorrect){quizCorrect++;quizSessionStreak++;toast('درست! ✓','success')}
  else{quizWrong++;quizSessionStreak=0;toast('نادرست! ✗','error')}
  // XP for quiz
  const xpGain=isCorrect?5:1;
  S.stats.xp+=xpGain;
  S.stats.reviewed++;
  if(isCorrect)S.stats.correct++;else S.stats.wrong++;
  const dk=todayKey();
  if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};
  S.stats.history[dk].reviewed++;
  if(isCorrect)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
  // Streak
  if(S.stats.lastReviewDate!==dk){if(S.stats.lastReviewDate===new Date(Date.now()-MS_PER_DAY).toISOString().slice(0,10))S.stats.streak++;else S.stats.streak=1;S.stats.lastReviewDate=dk}
  // FSRS update
  if(quizState.card){
    const w=S.words.find(x=>x.id===quizState.card.id);
    if(w){fsrsNext(w,isCorrect?3:1);save()}else save();
  }else save();
  // Persistence
  updateQuizWordPerformance(quizState.card.id,isCorrect);
  // Record confusion if wrong
  if(!isCorrect&&quizState.card&&quizState.selected>=0){
    const selectedOption=quizState.options[quizState.selected];
    const correctWord=quizState.card;
    // Find which word was selected
    const confusedWord=S.words.find(x=>x.translation===selectedOption||x.word===selectedOption);
    if(confusedWord)recordConfusion(correctWord.id,confusedWord.id);
  }
  // Session-aware scheduling
  recordSessionAnswer(quizState.card.id,isCorrect);
  _quizQuestionNum++;
  if(S.quizStats&&S.quizStats.currentSession){
    if(isCorrect)S.quizStats.currentSession.correct++;else S.quizStats.currentSession.wrong++;
    S.quizStats.currentSession.words.push({id:quizState.card.id,correct:isCorrect});
    save();
  }
  // Start undo timer
  if(_quizUndoTimer)clearTimeout(_quizUndoTimer);
  _quizUndoTimer=setTimeout(()=>{_quizUndoState=null;_quizUndoTimer=null},3500);
}

function undoQuizAnswer(){
  if(!_quizUndoState)return;
  const u=_quizUndoState;
  _quizUndoState=null;if(_quizUndoTimer){clearTimeout(_quizUndoTimer);_quizUndoTimer=null}

  // Restore counters
  quizCorrect=u.quizCorrect;
  quizWrong=u.quizWrong;
  quizSessionStreak=u.quizSessionStreak;
  S.stats.reviewed=u.statsReviewed;
  S.stats.correct=u.statsCorrect;
  S.stats.wrong=u.statsWrong;
  // Restore daily history
  if(u.dkHistory)S.stats.history[u.dk]=u.dkHistory;
  else delete S.stats.history[u.dk];
  // Restore FSRS state
  const w=S.words.find(x=>x.id===u.cardId);
  if(w&&u.fsrsSnapshot){
    Object.assign(w,u.fsrsSnapshot);
  }
  // Undo XP
  S.stats.xp-=u.isCorrect?5:1;
  if(S.stats.xp<0)S.stats.xp=0;
  // Undo session tracking
  if(S.quizStats&&S.quizStats.currentSession){
    if(u.isCorrect)S.quizStats.currentSession.correct--;else S.quizStats.currentSession.wrong--;
    S.quizStats.currentSession.words.pop();
  }
  _quizQuestionNum--;
  save();
  // Re-show the same question (reset quiz state)
  quizState.answered=false;
  quizState.selected=-1;
  toast('پاسخ لغو شد','info');
  renderQuiz(document.getElementById('content'));
  initQuiz();
}

// ═══════════════════════════════════════════
// LEVELS & GAMIFICATION
// ═══════════════════════════════════════════
function getLevel(xp){
  const levels=[
    {name:'مبتدی',icon:'🌱',min:0},
    {name:'تازه‌کار',icon:'📗',min:50},
    {name:' học viên',icon:'📘',min:150},
    {name:'ระดับกลาง',icon:'📙',min:350},
    {name:'پیشرفته',icon:'📕',min:700},
    {name:'حرفه‌ای',icon:'🎓',min:1200},
    {name:'استاد',icon:'🏆',min:2000},
    {name:'اسطوره',icon:'👑',min:3500},
    {name:'بی‌نهایت',icon:'⚡',min:5000}
  ];
  let current=levels[0];
  let next=levels[1];
  for(let i=levels.length-1;i>=0;i--){if(xp>=levels[i].min){current=levels[i];next=levels[i+1]||null;break}}
  const progress=next?((xp-current.min)/(next.min-current.min)*100):100;
  return{...current,next,progress:Math.min(100,progress),xp};
}

function checkFillAnswer(){
  if(quizState.answered)return;
  const input=document.getElementById('quizFillInput');
  if(!input)return;
  const answer=input.value.trim().toLowerCase();
  const correct=quizState.card.translation.toLowerCase();

// ═══════════════════════════════════════════
// QUIZ GENERATOR (Smart Selection + Adaptive)
// ═══════════════════════════════════════════
function genQuiz(){
if(quizState.timer){clearTimeout(quizState.timer);quizState.timer=null}
const valid=S.words.filter(w=>w.translation&&w.translation.trim());
if(valid.length<4)return;

// Weighted selection: weaker words appear more often, skip session-skipped
const weights=valid.map(w=>{
  if(shouldSkipInSession(w.id))return 0;
  const strength=getWordStrength(w);
  const inHistory=quizHistory.includes(w.id);
  return Math.max(0.1,(1-strength+0.1)*(inHistory?0.2:1));
});
const totalWeight=weights.reduce((a,b)=>a+b,0);
let r=Math.random()*totalWeight;
let w=valid[0];
for(let i=0;i<valid.length;i++){r-=weights[i];if(r<=0){w=valid[i];break}}

// Adaptive difficulty: pick distractors based on streak
const difficulty=quizSessionStreak>=3?0.8:quizSessionStreak>=1?0.5:0.2;

if(quizMode==='mcq'||quizMode==='reverse'){
  const opts=new Set();
  const target=quizMode==='reverse'?w.word:w.translation;
  opts.add(target);
  const distractors=S.words.filter(x=>x.id!==w.id&&x.translation&&x.translation.trim());
  const distractorField=quizMode==='reverse'?'word':'translation';
  // Sort: confusion partners first, then by frequency tier proximity
  const targetTier=getFrequencyTier(w.word);
  const confusionIds=new Set(getConfusionPartners(w.id));
  distractors.sort((a,b)=>{
    const aConfused=confusionIds.has(a.id)?0:1;
    const bConfused=confusionIds.has(b.id)?0:1;
    if(aConfused!==bConfused)return aConfused-bConfused;
    const aDiff=Math.abs(getFrequencyTier(a.word)-targetTier);
    const bDiff=Math.abs(getFrequencyTier(b.word)-targetTier);
    return aDiff-bDiff;
  });
  const poolSize=Math.ceil(distractors.length*difficulty);
  const hardPool=distractors.slice(0,Math.max(3,poolSize));
  const seen=new Set([target]);
  for(let i=0;i<3&&hardPool.length;i++){const rIdx=Math.floor(Math.random()*hardPool.length);const r=hardPool.splice(rIdx,1)[0];const val=r[distractorField];if(!seen.has(val)){opts.add(val);seen.add(val)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:''};
}else if(quizMode==='antonym'){
  const opts=new Set();
  let correctAntonym=w.antonyms&&w.antonyms.length>0?w.antonyms[0]:null;
  if(!correctAntonym){correctAntonym=w.translation;}// fallback
  opts.add(correctAntonym);
  const others=S.words.filter(x=>x.id!==w.id&&x.translation);
  const seen=new Set([correctAntonym]);
  for(let i=0;i<3&&others.length;i++){const rIdx=Math.floor(Math.random()*others.length);const r=others.splice(rIdx,1)[0];const val=r.translation;if(!seen.has(val)){opts.add(val);seen.add(val)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:correctAntonym};
}else if(quizMode==='sentfill'){
  let sentence=w.context||'';if(!sentence&&w.examples&&w.examples.length>0)sentence=w.examples[0];
  if(!sentence)sentence=`The word "${w.word}" means ___`;
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:sentence};
}else if(quizMode==='spell'){
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:''};
}else if(quizMode==='defmatch'){
  const opts=new Set();
  opts.add(w.word);
  let definition=w.coreMeaning||'';if(!definition&&w.definitions&&w.definitions.length>0)definition=w.definitions[0];
  const others=S.words.filter(x=>x.id!==w.id);
  const seen=new Set([w.word]);
  for(let i=0;i<3&&others.length;i++){const rIdx=Math.floor(Math.random()*others.length);const r=others.splice(rIdx,1)[0];if(!seen.has(r.word)){opts.add(r.word);seen.add(r.word)}}
  quizState={card:w,options:[...opts].sort(()=>Math.random()-.5),answered:false,selected:-1,timer:null,quizText:definition||w.translation};
}else{
  // fill, listen
  quizState={card:w,options:[],answered:false,selected:-1,timer:null,quizText:''};
}

quizHistory.push(w.id);if(quizHistory.length>20)quizHistory.shift();
}

function initQuiz(){
if(['fill','listen','sentfill','spell'].includes(quizMode))return;
const c=document.getElementById('quizContainer');
if(!c)return;
c.onclick=e=>{
const btn=e.target.closest('[data-qi]');
if(!btn||quizState.answered)return;
const idx=parseInt(btn.dataset.qi);
quizState.answered=true;
quizState.selected=idx;

let isCorrect;
if(quizMode==='reverse'||quizMode==='defmatch'){
  isCorrect=quizState.options[idx]===quizState.card.word;
}else if(quizMode==='antonym'){
  isCorrect=quizState.options[idx]===quizState.quizText;
}else{
  isCorrect=quizState.options[idx]===quizState.card.translation;
}
handleQuizAnswer(isCorrect);
renderQuiz(document.getElementById('content'));
quizState.timer=setTimeout(()=>{genQuiz();renderQuiz(document.getElementById('content'));initQuiz()},1500)}}

// CORS proxy for browser-side API calls
// Multiple fallbacks for reliability
const AI_CORS_PROXIES=[
  url=>'https://corsproxy.io/?'+encodeURIComponent(url),
  url=>'https://api.allorigins.win/raw?url='+encodeURIComponent(url),
  url=>url // direct (works if API adds CORS headers, or from localhost)
];
async function aiFetch(url,opts){
  for(let i=0;i<AI_CORS_PROXIES.length;i++){
    const proxyUrl=AI_CORS_PROXIES[i](url);
    try{
      const r=await fetch(proxyUrl,opts);
      if(r.ok)return r;
      // If proxy returned an error but didn't throw, try next
      if(i<AI_CORS_PROXIES.length-1)continue;
      return r; // last attempt, return as-is
    }catch(e){
      if(i<AI_CORS_PROXIES.length-1){console.log('[AI] Proxy '+(i+1)+' failed, trying next...');continue}
      throw e // all proxies failed
    }
  }
}
function aiProxy(url){return url} // kept for compatibility, not used in new code

function aiGetProvider(){return AI_PROVIDERS[S.settings.aiChat.provider]||AI_PROVIDERS.gemini}
function aiCheckDailyLimit(){
  const ac=S.settings.aiChat;
  const today=todayKey();
  if(ac.dailyUsageDate!==today){ac.dailyUsageDate=today;ac.dailyUsage=0;save()}
  return ac.dailyUsage<ac.dailyLimit
}
function aiIncrementUsage(){
  const ac=S.settings.aiChat;
  const today=todayKey();
  if(ac.dailyUsageDate!==today){ac.dailyUsageDate=today;ac.dailyUsage=0}
  ac.dailyUsage++;save()
}
function aiRemainingRequests(){return Math.max(0,S.settings.aiChat.dailyLimit-S.settings.aiChat.dailyUsage)}

async function aiFetchUsage(){
  const ac=S.settings.aiChat;
  const currentKey=ac.apiKeys[ac.provider]||ac.apiKey||'';
  if(!currentKey)return null;
  const provider=aiGetProvider();
  if(!provider.fetchUsage)return null;
  try{
    const data=await provider.fetchUsage(currentKey);
    if(data){ac.providerUsage={...data,lastFetched:Date.now()};save()}
    return data
  }catch(e){return null}
}

async function sendAiMessage(userText,attachments){
  const ac=S.settings.aiChat;
  const currentKey=ac.apiKeys[ac.provider]||ac.apiKey||'';
  if(!currentKey){throw new Error('لطفاً کلید API را وارد کنید')}
  if(!aiCheckDailyLimit()){throw new Error('محدودیت روزانه ('+ac.dailyLimit+' درخواست) به پایان رسیده است. فردا دوباره تلاش کنید.')}
  const provider=aiGetProvider();
  // If attachments but no text, add default prompt
  const hasAttachments=attachments&&attachments.length>0;
  if(hasAttachments)console.log('[AI] Sending with',attachments.length,'attachment(s), types:',attachments.map(a=>a.mimeType).join(', '));
  const textToSend=userText||(hasAttachments?'Describe and analyze this image/file':'');
  const msg={role:'user',text:textToSend,timestamp:Date.now()};
  if(hasAttachments)msg.attachments=attachments;
  ac.messages.push(msg);
  save();
  try{
    const result=await provider.send(currentKey,ac.model,ac.messages.filter(m=>m.role!=='error'),ac.systemPrompt,ac.temperature,ac.maxTokens,attachments);
    const reply=typeof result==='string'?result:result.text;
    const rateLimits=typeof result==='string'?null:result.rateLimits;
    ac.messages.push({role:'assistant',text:reply,timestamp:Date.now()});
    aiIncrementUsage();
    ac.connectionStatus='connected';
    ac.lastError='';
    if(rateLimits)ac.providerUsage={...rateLimits,lastFetched:Date.now()};
    save();
    aiSyncMessages();
    return reply
  }catch(e){
    ac.messages.push({role:'error',text:e.message,timestamp:Date.now()});
    ac.connectionStatus='error';
    ac.lastError=e.message;
    save();
    throw e
  }
}

async function aiTestConnection(){
  const ac=S.settings.aiChat;
  const currentKey=ac.apiKeys[ac.provider]||ac.apiKey||'';
  if(!currentKey){toast('لطفاً کلید API را وارد کنید','error');return}
  const provider=aiGetProvider();
  try{
    ac.connectionStatus='connecting';save();
    renderAiChat(document.getElementById('content'));
    await provider.testConnection(currentKey,ac.model);
    ac.connectionStatus='connected';ac.lastError='';
    save();
    toast('اتصال برقرار شد ✓','success');
    await aiFetchUsage();
    renderAiChat(document.getElementById('content'))
  }catch(e){
    ac.connectionStatus='error';ac.lastError=e.message;
    save();
    toast('خطا: '+e.message,'error');
    renderAiChat(document.getElementById('content'))
  }
}

  })

  return(bytes/1048576).toFixed(1)+' MB'
}

function aiBuildProviderUsageCard(ac,provider){
  const pu=ac.providerUsage;
  const providerKey=ac.provider;
  const fetchedAgo=pu&&pu.lastFetched?Math.round((Date.now()-pu.lastFetched)/60000):null;
  const fetchedStr=fetchedAgo===null?'':fetchedAgo<1?'لحظات پیش':fetchedAgo<60?fetchedAgo+' دقیقه پیش':Math.round(fetchedAgo/60)+' ساعت پیش';

  if(providerKey==='openrouter'&&pu){
    const used=pu.creditsUsed||0;
    const limit=pu.creditsLimit;
    const hasLimit=limit!==null&&limit>0;
    const pct=hasLimit?Math.min(100,Math.round((used/limit)*100)):0;
    const color=pct>90?'var(--danger)':pct>70?'var(--warning)':'var(--success)';
    return`<div style="padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--border)">
      <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">💳 اعتبار OpenRouter ${pu.isFreeTier?'<span class="badge badge-warning" style="font-size:.6rem;padding:1px 6px;margin-right:4px">رایگان</span>':''}</div>
      <div style="font-size:1.3rem;font-weight:800;color:var(--accent)">$${used.toFixed(4)} ${hasLimit?'<span style="font-size:.8rem;font-weight:400;color:var(--text2)">/ $'+limit.toFixed(2)+'</span>':''}</div>
      ${pu.label?'<div style="font-size:.7rem;color:var(--text2);margin-top:2px">کلید: '+esc(pu.label)+'</div>':''}
      ${hasLimit?'<div class="ai-usage-bar"><div class="ai-usage-fill" style="width:'+pct+'%;background:'+color+'"></div></div>':''}
      ${pu.rateLimit?'<div style="font-size:.7rem;color:var(--text2);margin-top:4px">محدودیت نرخ: '+pu.rateLimit.requests+' درخواست/'+pu.rateLimit.interval+'</div>':''}
      ${fetchedStr?'<div style="font-size:.65rem;color:var(--text2);margin-top:4px;opacity:.6">بروزرسانی: '+fetchedStr+'</div>':''}
    </div>`
  }

  if(providerKey==='groq'&&pu){
    const rr=pu.remainingRequests;
    const lr=pu.limitRequests;
    const rt=pu.remainingTokens;
    const lt=pu.limitTokens;
    const hasReq=rr!==null&&lr!==null;
    const hasTok=rt!==null&&lt!==null;
    const reqPct=hasReq?Math.round(((lr-rr)/lr)*100):0;
    const reqColor=reqPct>90?'var(--danger)':reqPct>70?'var(--warning)':'var(--success)';
    let resetStr='';
    if(pu.resetRequests)resetStr=pu.resetRequests;
    else if(pu.resetTokens)resetStr=pu.resetTokens;
    return`<div style="padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--border)">
      <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">⚡ محدودیت‌های Groq</div>
      ${hasReq?`<div style="font-size:1.1rem;font-weight:700;color:var(--accent)">${rr} <span style="font-size:.8rem;font-weight:400;color:var(--text2)">/ ${lr} درخواست</span></div><div class="ai-usage-bar"><div class="ai-usage-fill" style="width:${reqPct}%;background:${reqColor}"></div></div>`:''}
      ${hasTok?`<div style="font-size:.85rem;color:var(--text2);margin-top:6px">توکن: <strong>${rt?.toLocaleString()}</strong> / ${lt?.toLocaleString()}</div>`:''}
      ${resetStr?'<div style="font-size:.7rem;color:var(--text2);margin-top:4px">ریست: '+esc(resetStr)+'</div>':''}
      ${fetchedStr?'<div style="font-size:.65rem;color:var(--text2);margin-top:4px;opacity:.6">بروزرسانی: '+fetchedStr+'</div>':''}
    </div>`
  }

  // Gemini or no data
  return`<div style="padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--border)">
    <div style="font-size:.75rem;color:var(--text2);margin-bottom:4px">📈 مصرف ارائه‌دهنده</div>
    <div style="font-size:.85rem;color:var(--text2);padding:8px 0">
      ${providerKey==='gemini'?'برای Gemini، فقط شمارنده محلی در دسترس است.':'برای بروزرسانی، دکمه 🔄 را بزنید.'}
    </div>
    ${fetchedStr?'<div style="font-size:.65rem;color:var(--text2);opacity:.6">بروزرسانی: '+fetchedStr+'</div>':''}
  </div>`
}

// ── Chat Management Helpers ──
function aiGetActiveChat(){
  const ac=S.settings.aiChat;
  if(!ac.chats.length){
    // Migrate old single-message chat
    const chat={id:uid(),title:'چت '+new Date().toLocaleDateString('fa-IR'),messages:ac.messages||[],createdAt:Date.now(),updatedAt:Date.now()};
    ac.chats=[chat];
    ac.activeChat=chat.id;
    save();
  }
  if(!ac.activeChat||!ac.chats.find(c=>c.id===ac.activeChat)){
    ac.activeChat=ac.chats[ac.chats.length-1].id;
    save();
  }
  return ac.chats.find(c=>c.id===ac.activeChat)
}
function aiNewChat(){
  const ac=S.settings.aiChat;
  const chat={id:uid(),title:'چت جدید',messages:[],createdAt:Date.now(),updatedAt:Date.now()};
  ac.chats.push(chat);
  ac.activeChat=chat.id;
  ac.messages=[];
  save();
  renderAiChat(document.getElementById('content'));
  toast('چت جدید ساخته شد','success')
}
function aiDeleteChat(chatId){
  const ac=S.settings.aiChat;
  if(ac.chats.length<=1){toast('حداقل یک چت باید وجود داشته باشد','error');return}
  ac.chats=ac.chats.filter(c=>c.id!==chatId);
  if(ac.activeChat===chatId){
    ac.activeChat=ac.chats[ac.chats.length-1].id;
  }
  const active=ac.chats.find(c=>c.id===ac.activeChat);
  ac.messages=active?active.messages:[];
  save();
  renderAiChat(document.getElementById('content'));
  toast('چت حذف شد','info')
}
function aiSwitchChat(chatId){
  const ac=S.settings.aiChat;
  const chat=ac.chats.find(c=>c.id===chatId);
  if(!chat)return;
  ac.activeChat=chatId;
  ac.messages=chat.messages;
  save();
  renderAiChat(document.getElementById('content'))
}
function aiSyncMessages(){
  // Sync current messages back to active chat
  const ac=S.settings.aiChat;
  const chat=ac.chats.find(c=>c.id===ac.activeChat);
  if(chat){
    chat.messages=ac.messages;
    chat.updatedAt=Date.now();
    // Auto-title from first user message
    if(chat.title==='چت جدید'){
      const first=ac.messages.find(m=>m.role==='user');
      if(first&&first.text)chat.title=first.text.slice(0,40)+(first.text.length>40?'...':'');
    }
    save()
  }
}

  document.getElementById('aiApiKey').onchange=e=>{ac.apiKeys[ac.provider]=e.target.value.trim();ac.apiKey=ac.apiKeys[ac.provider];ac.connectionStatus='disconnected';save()};

    const btn=document.getElementById('aiTestBtn');
    const key=ac.provider;
    const keyVal=document.getElementById('aiApiKey').value.trim();
    if(!keyVal){toast('کلید API را وارد کنید','error');return}
    ac.apiKeys[ac.provider]=keyVal;
    ac.apiKey=keyVal;save();
    btn.disabled=true;btn.textContent='⏳';
    try{
      await AI_PROVIDERS[key].testConnection(keyVal,AI_PROVIDERS[key].models[0].id);
      ac.connectionStatus='connected';ac.lastError='';save();
      btn.textContent='✓';btn.className='btn btn-success btn-sm';
      toast(AI_PROVIDERS[key].name+' متصل شد','success');
      await aiFetchUsage();
    }catch(e){
      const errDetail=e.message+' (provider: '+key+', model: '+AI_PROVIDERS[key].models[0].id+')';
      ac.connectionStatus='error';ac.lastError=errDetail;save();
      btn.textContent='✗';btn.className='btn btn-danger btn-sm';
      toast(errDetail,'error');
    }finally{
      setTimeout(()=>{btn.disabled=false;btn.textContent='🔗 تست';btn.className='btn btn-primary btn-sm'},2000);
    }
  };

  // Settings controls
  const ts=document.getElementById('aiTemp');
  if(ts)ts.oninput=e=>{ac.temperature=parseFloat(e.target.value);document.getElementById('aiTempVal').textContent=ac.temperature;save()};
  const mt=document.getElementById('aiMaxTokens');
  if(mt)mt.onchange=e=>{ac.maxTokens=parseInt(e.target.value)||2048;save()};
  const sp=document.getElementById('aiSysPrompt');
  if(sp)sp.onchange=e=>{ac.systemPrompt=e.target.value;save()};

  document.getElementById('aiSaveBtn').onclick=()=>{
    const s=document.getElementById('aiSysPrompt');if(s)ac.systemPrompt=s.value;
    const t=document.getElementById('aiTemp');if(t)ac.temperature=parseFloat(t.value);
    const m=document.getElementById('aiMaxTokens');if(m)ac.maxTokens=parseInt(m.value)||2048;
    save();toast('تنظیمات ذخیره شد','success');
  };
  document.getElementById('aiClearChatBtn').onclick=()=>{
    if(!ac.messages.length)return;
    if(confirm('تمام پیام‌ها پاک شوند؟')){ac.messages=[];save();renderAiChat(c);toast('چت پاک شد','info')}
  };
  document.getElementById('aiExportBtn').onclick=()=>{
    if(!ac.messages.length){toast('چتی نیست','info');return}
    const lines=ac.messages.map(m=>'['+new Date(m.timestamp).toLocaleString('fa-IR')+'] '+(m.role==='user'?'کاربر':'دستیار')+': '+m.text);
    const b=new Blob([lines.join('\n\n')],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chat-'+todayKey()+'.txt';a.click();URL.revokeObjectURL(a.href);toast('خروجی دانلود شد','success');
  };
  document.getElementById('aiRefreshUsage').onclick=async()=>{
    const btn=document.getElementById('aiRefreshUsage');btn.disabled=true;btn.textContent='⏳';
    await aiFetchUsage();btn.disabled=false;btn.textContent='🔄 بروزرسانی';
    toast('مصرف بروزرسانی شد','success');
  };

  // Quick prompts
  document.querySelectorAll('.ai-qp-btn').forEach(btn=>{
    btn.onclick=()=>{
      const inp=document.getElementById('aiInput');
      if(inp){inp.value=btn.dataset.prompt;inp.focus();inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'}
    };
  });

  // ── File attachments ──
  let pendingAttachments=[];
  const fileInput=document.getElementById('aiFileInput');
  const attachBtn=document.getElementById('aiAttachBtn');
  const attachPreview=document.getElementById('aiAttachPreview');

  function renderAttachPreview(){
    if(!attachPreview)return;
    if(!pendingAttachments.length){attachPreview.innerHTML='';return}
    attachPreview.innerHTML=pendingAttachments.map((a,i)=>{
      const isImg=a.mimeType&&a.mimeType.startsWith('image/');
      return'<div class="ai-attach-item">'+(isImg?'<img src="data:'+a.mimeType+';base64,'+a.base64+'" alt="'+esc(a.name)+'">':'<span style="font-size:1.4rem">📄</span>')+'<div class="ai-attach-info"><div class="ai-attach-name">'+esc(a.name)+'</div><div class="ai-attach-size">'+aiFormatFileSize(a.size)+'</div></div><button type="button" class="ai-attach-remove" data-idx="'+i+'">✕</button></div>';
    }).join('');
    attachPreview.querySelectorAll('.ai-attach-remove').forEach(b=>{b.onclick=()=>{pendingAttachments.splice(parseInt(b.dataset.idx),1);renderAttachPreview()}});
  }

  if(attachBtn){
    attachBtn.onclick=()=>fileInput.click();
    fileInput.onchange=async e=>{
      const files=Array.from(e.target.files||[]);
      let added=0;
      for(const f of files){
        if(f.size>20*1024*1024){toast(f.name+': بیش از 20MB','error');continue}
        try{
          if(f.type.startsWith('image/')||f.type==='application/pdf'){const d=await aiReadFileAsDataURL(f);pendingAttachments.push({name:f.name,mimeType:f.type,size:f.size,base64:d.split(',')[1]});added++}
          else if(['text/plain','text/csv','text/markdown','application/json'].includes(f.type)){const t=await aiReadFileAsText(f);pendingAttachments.push({name:f.name,mimeType:f.type||'text/plain',size:f.size,base64:btoa(unescape(encodeURIComponent(t)))});added++}
          else toast('نوع فایل '+f.name+' پشتیبانی نمی‌شود','error');
        }catch(err){toast('خطا: '+f.name,'error')}
      }
      fileInput.value='';
      if(added>0){
        renderAttachPreview();
        console.log('[AI] Attached',added,'file(s), total pending:',pendingAttachments.length);
        toast(added+' فایل پیوست شد','success');
      }
    };
  }

  if(chatArea){
    chatArea.addEventListener('dragover',e=>{e.preventDefault();chatArea.style.outline='2px dashed var(--accent)'});
    chatArea.addEventListener('dragleave',()=>{chatArea.style.outline=''});
    chatArea.addEventListener('drop',async e=>{
      e.preventDefault();chatArea.style.outline='';
      for(const f of Array.from(e.dataTransfer.files||[])){
        if(f.size>20*1024*1024)continue;
        try{
          if(f.type.startsWith('image/')||f.type==='application/pdf'){const d=await aiReadFileAsDataURL(f);pendingAttachments.push({name:f.name,mimeType:f.type,size:f.size,base64:d.split(',')[1]})}
          else if(['text/plain','text/csv','text/markdown','application/json'].includes(f.type)){const t=await aiReadFileAsText(f);pendingAttachments.push({name:f.name,mimeType:f.type||'text/plain',size:f.size,base64:btoa(unescape(encodeURIComponent(t)))})}
        }catch(err){}
      }
      renderAttachPreview();
    });
    chatArea.addEventListener('paste',async e=>{
      for(const item of Array.from(e.clipboardData?.items||[])){
        if(item.type.startsWith('image/')){
          e.preventDefault();
          const file=item.getAsFile();if(!file)continue;
          try{const d=await aiReadFileAsDataURL(file);pendingAttachments.push({name:'clipboard.png',mimeType:file.type,size:file.size,base64:d.split(',')[1]});renderAttachPreview();toast('تصویر پیوست شد','success')}catch(err){}
        }
      }
    });
  }

  // ── Send ──
  const input=document.getElementById('aiInput');
  const sendBtn=document.getElementById('aiSendBtn');
  let sending=false;

  async function doSend(){
    const text=input.value.trim();
    if((!text&&!pendingAttachments.length)||sending)return;
    if(!(ac.apiKeys[ac.provider]||ac.apiKey)){toast('کلید API را وارد کنید','error');return}
    if(!aiCheckDailyLimit()){toast('محدودیت روزانه','error');return}
    sending=true;sendBtn.disabled=true;sendBtn.textContent='⏳';
    const att=[...pendingAttachments];pendingAttachments=[];
    input.value='';input.style.height='auto';
    if(attachPreview)attachPreview.innerHTML='';
    const qp=c.querySelector('.ai-quick-prompts');if(qp)qp.remove();
    const ub=document.createElement('div');ub.className='ai-bubble ai-bubble-user';
    let ah='';
    if(att.length)ah='<div class="ai-attach-in-bubble">'+att.map(a=>a.mimeType.startsWith('image/')?'<span class="ai-attach-tag"><img src="data:'+a.mimeType+';base64,'+a.base64+'"><span>'+esc(a.name)+'</span></span>':'<span class="ai-attach-tag">📄 '+esc(a.name)+'</span>').join('')+'</div>';
    const displayText=text||(att.length?'این تصویر/فایل را توصیف و تحلیل کن':'');
    ub.innerHTML='<div>'+esc(displayText)+'</div>'+ah+'<div class="ai-bubble-meta"><span>'+new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})+'</span></div>';
    chatArea.appendChild(ub);
    const ty=document.createElement('div');ty.className='ai-typing';ty.innerHTML='<div class="ai-typing-dots"><span></span><span></span><span></span></div><span>در حال تایپ...</span>';
    chatArea.appendChild(ty);chatArea.scrollTop=chatArea.scrollHeight;
    try{await sendAiMessage(text,att);aiSyncMessages();ty.remove();renderAiChat(c)}
    catch(e){ty.remove();toast(e.message,'error');renderAiChat(c)}
    finally{sending=false;sendBtn.disabled=false;sendBtn.textContent='➤'}
  }

  // ── Chat Management Events ──
  document.getElementById('aiNewChatBtn').onclick=()=>aiNewChat();
  document.getElementById('aiDeleteChatBtn').onclick=()=>{
    if(confirm('آیا چت فعلی حذف شود؟'))aiDeleteChat(ac.activeChat)
  };
  document.querySelectorAll('.ai-chat-tab').forEach(tab=>{
    tab.onclick=()=>aiSwitchChat(tab.dataset.chatid)
  });

  sendBtn.onclick=doSend;
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
  input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px'});
  setTimeout(()=>input.focus(),100);
}

// Listen for quiz results from external English Quiz iframe
window.addEventListener('message',(event)=>{
  const data=event.data;
  if(!data||!data.type)return;
  if(data.type==='quiz-answer'&&data.wordId){
    const w=S.words.find(x=>x.id===data.wordId||x.word.toLowerCase()===(data.word||'').toLowerCase());
    if(w){fsrsNext(w,data.rating||(data.isCorrect?3:1));save()}
    if(S.quizStats){
      const wordKey=data.wordId||data.word||'unknown';
      updateQuizWordPerformance(wordKey,!!data.isCorrect);
    }
  }
  if(data.type==='quiz-complete'&&data.results){
    if(!S.quizStats)S.quizStats={sessions:[],totalCorrect:0,totalWrong:0,wordPerformance:{},currentSession:null};
    S.quizStats.sessions.push({date:new Date().toISOString(),correct:data.results.correct,wrong:data.results.wrong,mode:'external',duration:0});
    if(S.quizStats.sessions.length>50)S.quizStats.sessions=S.quizStats.sessions.slice(-50);
    S.quizStats.totalCorrect+=data.results.correct;
    S.quizStats.totalWrong+=data.results.wrong;
    if(data.results.wordResults){
      data.results.wordResults.forEach(r=>{
        updateQuizWordPerformance(r.wordId||r.questionId,!!r.correct);
      });
    }
    save();
    toast(`آزمون انگلیسی تمام شد: ${data.results.correct}/${data.results.total}`,'success');
  }
});

// NOTIFICATION REMINDERS
// ═══════════════════════════════════════════
function checkNotifications(){
  if(!S.settings.notifications)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const due=getDue();
  if(due.length===0)return;
  const now=new Date();
  const timeParts=(S.settings.notificationTime||'09:00').split(':');
  const notifHour=parseInt(timeParts[0])||9;
  const notifMin=parseInt(timeParts[1])||0;
  if(now.getHours()===notifHour&&Math.abs(now.getMinutes()-notifMin)<5){
    const lastNotif=localStorage.getItem('leitner_last_notif');
    if(lastNotif===todayKey())return;
    localStorage.setItem('leitner_last_notif',todayKey());
    new Notification('لایتنر - یادآوری مرور',{
      body:`${due.length} کلمه منتظر مرور شماست!`,
      icon:'data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2720%27 fill=%27%236c5ce7%27/%3E%3Ctext x=%2750%27 y=%2768%27 text-anchor=%27middle%27 font-size=%2750%27 fill=%27white%27%3E📖%3C/text%3E%3C/svg%3E'
    })}
}

// Check every 5 minutes
setInterval(checkNotifications,5*60*1000);

if('serviceWorker' in navigator){
  try{
    const swCode=`const CACHE_NAME='leitner-v3';const ASSETS=['./leitner.html'];self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(self.clients.claim())});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>{if(r)return r;return fetch(e.request).then(resp=>{if(resp&&resp.status===200&&resp.type==='basic'){const clone=resp.clone();caches.open(CACHE_NAME).then(c=>c.put(e.request,clone))}return resp}).catch(()=>caches.match('./leitner.html')))})});`;
    const swBlob=new Blob([swCode],{type:'application/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(swBlob),{scope:'./'}).catch(()=>{});
  }catch(e){}
}
