window._deps={chartjs:null,pdfjs:null,jszip:null};
window._depLoading={};
async function loadDep(name,url,globalCheck){
  if(globalCheck&&globalCheck())return window._deps[name]=true;
  if(window._depLoading[name])return window._depLoading[name];
  window._depLoading[name]=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src=url;s.onload=()=>{window._deps[name]=true;resolve()};s.onerror=reject;
    document.head.appendChild(s);
  });
  return window._depLoading[name];
}
function ensureChartJs(){return loadDep('chartjs','https://cdn.jsdelivr.net/npm/chart.js@4',()=>!!window.Chart)}
function ensurePdfJs(){return loadDep('pdfjs','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',()=>!!window.pdfjsLib)}

<style>

/* ═══ ACCESSIBILITY ═══ */
/* High contrast mode */
[data-theme="high-contrast"]{
  --bg:#000;--bg2:#111;--card:#1a1a1a;--card-hover:#222;--border:#555;
  --text:#fff;--text2:#ccc;--accent:#9d8eff;--accent2:#c4b5ff;
  --success:#00e676;--danger:#ff5252;--warning:#ffd740;
  --accent-glow:rgba(157,142,255,.3);
  --shadow:0 4px 24px rgba(0,0,0,.8);
}
[data-theme="high-contrast"] .btn{border:1px solid var(--border)}
[data-theme="high-contrast"] .input{border:2px solid var(--border)}
[data-theme="high-contrast"] .nav-btn.active{border:2px solid var(--accent)}

/* Font size scale */
html[data-fontsize="small"]{font-size:14px}
html[data-fontsize="normal"]{font-size:16px}
html[data-fontsize="large"]{font-size:18px}
html[data-fontsize="xlarge"]{font-size:20px}

/* Skip to content link */
.skip-link{position:absolute;top:-100px;left:16px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;z-index:9999;font-size:.9rem;text-decoration:none;transition:top .2s}
.skip-link:focus{top:16px}

/* Screen reader only */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* Focus trap for modals */
.modal-overlay:focus-within .modal{outline:2px solid var(--accent);outline-offset:2px}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
  .review-inner{transition:none}
}
.import-steps{display:flex;align-items:center;justify-content:center;gap:0;margin-bottom:24px;flex-wrap:wrap}
.import-step-dot{width:38px;height:38px;border-radius:50%;background:var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;transition:all .4s cubic-bezier(.4,0,.2,1);flex-shrink:0}
.import-step-dot.active{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;box-shadow:0 0 0 4px rgba(108,92,231,.25),0 4px 16px rgba(108,92,231,.35);transform:scale(1.1)}
.import-step-dot.done{background:linear-gradient(135deg,var(--success),#00d2a0);color:#fff;box-shadow:0 2px 8px rgba(0,184,148,.3)}
.import-step-line{width:32px;height:2px;background:var(--border);flex-shrink:0}
.import-step-line.done{background:var(--success)}
.import-step-label{font-size:.65rem;color:var(--text2);text-align:center;margin-top:4px;white-space:nowrap}
.import-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.import-stat{text-align:center;padding:14px 10px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border);transition:all .3s}
.import-stat:hover{border-color:var(--accent);transform:translateY(-2px)}
.import-stat .val{font-size:1.6rem;font-weight:800;color:var(--accent);line-height:1.2}
.import-stat .lbl{font-size:.7rem;color:var(--text2);margin-top:4px}
.import-filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.import-filter-bar label{display:flex;align-items:center;gap:6px;font-size:.85rem;color:var(--text2);cursor:pointer;transition:color .2s}
.import-filter-bar label:hover{color:var(--text)}
.import-filter-bar input[type="radio"]{accent-color:var(--accent);width:16px;height:16px}
.import-word-grid{max-height:400px;overflow-y:auto;display:grid;gap:4px;margin-bottom:16px}
.import-word-item{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;background:var(--bg);cursor:pointer;transition:all .2s;border:1px solid transparent}
.import-word-item:hover{border-color:var(--accent);background:var(--accent-glow)}
.import-word-item.existing{opacity:.5}
.import-word-item input[type="checkbox"]{accent-color:var(--accent)}
.import-review-wrap{max-height:450px;overflow-y:auto}
.import-review-table{width:100%;border-collapse:collapse;font-size:.85rem}
.import-review-table th{padding:8px 10px;text-align:right;border-bottom:2px solid var(--border);color:var(--text2);font-size:.75rem;position:sticky;top:0;background:var(--card)}
.import-review-table td{padding:6px 10px;border-bottom:1px solid var(--border)}
.import-review-table input[type="text"]{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit;font-size:.85rem;transition:all .25s}
.import-review-table input[type="text"]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.import-review-table input[type="checkbox"]{accent-color:var(--accent)}
.import-progress-card{text-align:center;padding:48px 24px}
.import-progress-bar{width:100%;max-width:400px;margin:18px auto}
.import-done-card{text-align:center;padding:36px;max-width:500px;margin:0 auto}

/* ═══════════════════════════════════════════
   AI CHAT TAB
   ═══════════════════════════════════════════ */
.ai-chat-wrap{display:flex;flex-direction:column;gap:16px;max-width:800px;margin:0 auto}
.ai-settings-grid{display:grid;gap:14px}
.ai-settings-grid label{display:block;font-size:.85rem;color:var(--text2);margin-bottom:4px}
.ai-chat-area{min-height:400px;max-height:60vh;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.ai-chat-area::-webkit-scrollbar{width:5px}
.ai-chat-area::-webkit-scrollbar-track{background:transparent}
.ai-chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.ai-bubble{max-width:80%;padding:12px 16px;border-radius:16px;font-size:.9rem;line-height:1.7;word-break:break-word;position:relative;animation:aiBubbleIn .3s ease}
.ai-bubble-user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border-bottom-left-radius:4px}
.ai-bubble-assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--border);color:var(--text);border-bottom-right-radius:4px}
.ai-bubble-meta{font-size:.7rem;color:var(--text2);margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ai-bubble-user .ai-bubble-meta{color:rgba(255,255,255,.6)}
.ai-copy-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:3px 8px;border-radius:8px;font-size:.7rem;cursor:pointer;transition:all .2s}
.ai-copy-btn:hover{background:var(--accent-glow);color:var(--text);border-color:var(--accent)}
.ai-input-area{display:flex;gap:10px;align-items:flex-end;padding:16px;background:var(--card);border-radius:var(--radius);border:1px solid var(--border)}
.ai-input-area textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);font:inherit;font-size:.88rem;transition:all .25s;line-height:1.5}
.ai-input-area textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.ai-send-btn{width:44px;height:44px;flex-shrink:0}
.ai-empty{text-align:center;padding:60px 20px;color:var(--text2)}
.ai-empty .icon{font-size:3rem;margin-bottom:12px;opacity:.5}
.ai-empty p{margin-top:8px;font-size:.9rem}
.ai-typing{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:10px 16px;color:var(--text2);font-size:.85rem}
.ai-typing-dots span{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;animation:aiTyping 1.4s infinite}
.ai-typing-dots span:nth-child(2){animation-delay:.2s}
.ai-typing-dots span:nth-child(3){animation-delay:.4s}
.ai-status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:600}
.ai-status-connected{background:rgba(0,184,148,.15);color:var(--success);border:1px solid rgba(0,184,148,.2)}
.ai-status-disconnected{background:rgba(139,144,165,.15);color:var(--text2);border:1px solid rgba(139,144,165,.2)}
.ai-status-error{background:rgba(225,112,85,.15);color:var(--danger);border:1px solid rgba(225,112,85,.2)}
.ai-usage-bar{width:100%;height:8px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
.ai-usage-fill{height:100%;border-radius:6px;transition:width .5s}
.ai-model-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:.7rem;font-weight:600;background:rgba(108,92,231,.15);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.ai-security-note{font-size:.75rem;color:var(--text2);line-height:1.6;padding:10px 14px;background:var(--bg);border-radius:10px;border-right:3px solid var(--warning);margin-top:6px}
.ai-error-area{padding:10px 14px;background:rgba(225,112,85,.08);border:1px solid rgba(225,112,85,.2);border-radius:10px;color:var(--danger);font-size:.82rem;margin-top:8px}
@keyframes aiBubbleIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes aiTyping{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
@media(max-width:768px){.ai-bubble{max-width:90%}.ai-chat-area{min-height:300px;max-height:50vh}}
@media(max-width:640px){#aiAdvWrap .card>div[style*='grid-template-columns']{grid-template-columns:1fr!important}}

/* AI Chat — Modern Input & Attachments */
.ai-input-wrap{background:var(--card);border-top:1px solid var(--border);padding:0}
.ai-attach-preview{display:flex;gap:8px;padding:10px 16px 0;flex-wrap:wrap;overflow-x:auto}
.ai-attach-item{position:relative;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;font-size:.78rem;color:var(--text);max-width:240px;min-width:0}
.ai-attach-item img{width:40px;height:40px;object-fit:cover;border-radius:6px;flex-shrink:0}
.ai-attach-item .ai-attach-info{overflow:hidden;min-width:0}
.ai-attach-item .ai-attach-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.ai-attach-item .ai-attach-size{color:var(--text2);font-size:.68rem}
.ai-attach-remove{position:absolute;top:-6px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--danger);color:#fff;border:none;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:transform .15s}
.ai-attach-remove:hover{transform:scale(1.2)}
.ai-input-row{display:flex;align-items:flex-end;gap:8px;padding:12px 16px}
.ai-input-row textarea{flex:1;resize:none;min-height:44px;max-height:140px;padding:10px 14px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:.9rem;transition:all .25s;line-height:1.5}
.ai-input-row textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.ai-input-actions{display:flex;gap:6px;align-items:center}
.ai-attach-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.ai-attach-btn:hover{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.ai-send-btn{width:40px;height:40px;border-radius:50%!important;padding:0!important;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.ai-attach-in-bubble{margin-top:8px;padding:8px;background:rgba(255,255,255,.08);border-radius:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ai-bubble-user .ai-attach-in-bubble{background:rgba(255,255,255,.12)}
.ai-attach-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:.72rem;background:rgba(108,92,231,.15);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.ai-attach-tag img{width:18px;height:18px;object-fit:cover;border-radius:4px}
.ai-capabilities{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ai-cap-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:.7rem;font-weight:600;background:rgba(0,184,148,.12);color:var(--success);border:1px solid rgba(0,184,148,.2)}
.ai-key-hint{font-size:.7rem;color:var(--text2);text-align:center;padding:4px 0;opacity:.7}

/* ── Collapsible Settings ── */
.ai-settings-toggle{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;cursor:pointer;transition:all .2s;user-select:none}
.ai-settings-toggle:hover{background:var(--accent-glow)}
.ai-settings-toggle .ai-settings-summary{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--text2);flex:1;min-width:0}
.ai-settings-toggle .ai-settings-summary strong{color:var(--text);font-weight:600}
.ai-settings-toggle .chevron{transition:transform .3s;color:var(--text2);font-size:.9rem}
.ai-settings-toggle.open .chevron{transform:rotate(180deg)}
.ai-settings-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.ai-settings-body.open{max-height:3000px}

/* ── Provider Cards ── */
.ai-provider-cards{display:flex;flex-direction:column;gap:12px}
.ai-provider-card{border:2px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .3s;cursor:pointer}
.ai-provider-card:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-glow)}
.ai-provider-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow)}
.ai-provider-header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--bg);transition:background .2s}
.ai-provider-card.selected .ai-provider-header{background:linear-gradient(135deg,rgba(108,92,231,.08),rgba(108,92,231,.03))}
.ai-provider-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.ai-provider-meta{flex:1;min-width:0}
.ai-provider-meta h4{font-size:.95rem;font-weight:700;margin-bottom:2px}
.ai-provider-meta p{font-size:.75rem;color:var(--text2);line-height:1.4}
.ai-provider-status{flex-shrink:0}
.ai-provider-body{padding:0 18px;max-height:0;overflow:hidden;transition:all .4s cubic-bezier(.4,0,.2,1)}
.ai-provider-card.selected .ai-provider-body{padding:0 18px 16px;max-height:800px}
.ai-provider-body-inner{padding-top:14px;border-top:1px solid var(--border)}

/* ── Model List ── */
.ai-model-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ai-model-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);cursor:pointer;transition:all .2s}
.ai-model-item:hover{background:var(--accent-glow);border-color:var(--accent)}
.ai-model-item.selected{background:linear-gradient(135deg,rgba(108,92,231,.12),rgba(108,92,231,.05));border-color:var(--accent)}
.ai-model-name{font-size:.85rem;font-weight:600;flex:1}
.ai-model-desc{font-size:.7rem;color:var(--text2);margin-top:2px}
.ai-model-badges{display:flex;gap:4px;flex-wrap:wrap}
.ai-model-speed{font-size:.65rem;padding:2px 6px;border-radius:6px;font-weight:600}
.ai-speed-fast{background:rgba(0,184,148,.12);color:var(--success)}
.ai-speed-medium{background:rgba(253,203,110,.12);color:var(--warning)}
.ai-speed-slow{background:rgba(225,112,85,.12);color:var(--danger)}
.ai-model-vision{font-size:.65rem;padding:2px 6px;border-radius:6px;background:rgba(108,92,231,.12);color:var(--accent)}
.ai-model-free{font-size:.65rem;padding:2px 6px;border-radius:6px;background:rgba(0,184,148,.12);color:var(--success);font-weight:700}

/* ── Quick Prompts ── */
.ai-quick-prompts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
.ai-qp-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font:inherit;font-size:.72rem;cursor:pointer;transition:all .2s;white-space:nowrap}
.ai-qp-btn:hover{background:var(--accent-glow);color:var(--text);border-color:var(--accent)}

/* ── Inline Status ── */
.ai-test-status{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:4px 12px;border-radius:8px;transition:all .3s}
.ai-test-ok{background:rgba(0,184,148,.1);color:var(--success)}
.ai-test-err{background:rgba(225,112,85,.1);color:var(--danger)}
.ai-test-loading{background:rgba(108,92,231,.1);color:var(--accent)}

/* ── Chat Stats ── */
.ai-chat-stats{display:flex;gap:12px;padding:8px 16px;border-top:1px solid var(--border);font-size:.7rem;color:var(--text2);flex-wrap:wrap}
.ai-chat-stats span{display:flex;align-items:center;gap:4px}

/* ── Code blocks in bubbles ── */
.ai-bubble pre{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:8px 0;overflow-x:auto;font-size:.8rem;direction:ltr;text-align:left;line-height:1.5}
.ai-bubble code{font-family:'Fira Code',monospace;font-size:.82rem}
.ai-bubble p{margin-bottom:6px}
.ai-bubble p:last-child{margin-bottom:0}
.ai-bubble ul,.ai-bubble ol{margin:6px 0;padding-right:18px}
.ai-bubble li{margin-bottom:3px;font-size:.88rem}

/* ── Provider Section Toggle ── */
.ai-section-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;user-select:none;transition:all .2s;border-radius:var(--radius);background:var(--card);border:1px solid var(--border);margin-bottom:0}
.ai-section-toggle:hover{background:var(--card-hover)}
.ai-section-toggle h3{margin:0;font-size:.95rem;display:flex;align-items:center;gap:8px}
.ai-section-toggle .chevron{transition:transform .3s;font-size:.8rem;color:var(--text2)}
.ai-section-toggle.open .chevron{transform:rotate(180deg)}
.ai-section-body{max-height:0;overflow:hidden;transition:max-height .5s cubic-bezier(.4,0,.2,1)}
.ai-section-body.open{max-height:3000px}

/* ── Choose Button ── */
.ai-choose-btn{padding:5px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font:inherit;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.ai-choose-btn:hover{background:var(--accent-glow);color:var(--accent);border-color:var(--accent)}
.ai-choose-btn.active{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(108,92,231,.3)}
.ai-choose-btn.active:hover{box-shadow:0 4px 14px rgba(108,92,231,.45)}
.ai-prov-chip:hover{border-color:var(--accent)!important;background:var(--accent-glow)!important;transform:translateY(-1px)}
.ai-prov-chip:active{transform:scale(.97)}
.ai-chat-tab:hover{border-color:var(--accent)!important;background:var(--accent-glow)!important}
.ai-chat-tab.active{font-weight:600}

/* ═══════════════════════════════════════════
   HEATMAP & FORECAST (Stats)
   ═══════════════════════════════════════════ */
.heatmap{display:grid;grid-template-columns:repeat(53,1fr);gap:3px;margin:14px 0}
.heatmap-cell{width:100%;aspect-ratio:1;border-radius:3px;background:var(--bg);cursor:default;position:relative;transition:all .2s}
.heatmap-cell:hover{transform:scale(1.3);z-index:2}
.heatmap-cell[data-count]:hover::after{content:attr(data-count);position:absolute;bottom:110%;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:2px 6px;border-radius:4px;font-size:.65rem;white-space:nowrap;z-index:10}
.heatmap-l0{background:var(--bg)!important}.heatmap-l1{background:rgba(0,184,148,.2)!important}.heatmap-l2{background:rgba(0,184,148,.4)!important}.heatmap-l3{background:rgba(0,184,148,.6)!important}.heatmap-l4{background:rgba(0,184,148,.85)!important}
.heatmap-legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:.7rem;color:var(--text2);margin-top:8px}
.heatmap-legend-cell{width:12px;height:12px;border-radius:2px}

/* ═══════════════════════════════════════════
   FREQUENCY TIER BADGES
   ═══════════════════════════════════════════ */
.tier-1{background:rgba(0,184,148,.2);color:var(--success);border:1px solid rgba(0,184,148,.25)}
.tier-2{background:rgba(108,92,231,.15);color:var(--accent);border:1px solid rgba(108,92,231,.2)}
.tier-3{background:rgba(253,203,110,.15);color:var(--warning);border:1px solid rgba(253,203,110,.2)}
.tier-0{background:rgba(225,112,85,.1);color:var(--danger);border:1px solid rgba(225,112,85,.15)}

/* ═══════════════════════════════════════════
   CONTEXT SENTENCE
   ═══════════════════════════════════════════ */
.context-sentence{font-size:.8rem;color:var(--text2);font-style:italic;margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:12px;border-right:3px solid var(--accent);line-height:1.6;text-align:right}

/* ═══════════════════════════════════════════
   QUIZ TYPES
   ═══════════════════════════════════════════ */
.quiz-type-bar{display:flex;gap:6px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}.quiz-type-bar .btn-sm{font-size:.75rem;padding:6px 10px}
.quiz-input{width:100%;padding:16px;border:2px solid var(--border);border-radius:14px;background:var(--bg);color:var(--text);font:inherit;font-size:1.1rem;text-align:center;transition:all .25s}
.quiz-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-glow)}

/* ═══════════════════════════════════════════
   OFFLINE INDICATOR
   ═══════════════════════════════════════════ */
.offline-banner{background:linear-gradient(90deg,var(--warning),#f0c040);color:#000;text-align:center;padding:8px;font-size:.82rem;font-weight:600;display:none;letter-spacing:.02em}
.offline-banner.visible{display:block}
.eng-quiz-frame{width:100%;height:calc(100vh - 140px);min-height:600px;border:none;border-radius:var(--radius);background:var(--card)}
/* TEXT SELECTION INPUT */
.text-selectable{line-height:2.4;direction:ltr;text-align:left;font-size:1rem;user-select:none;-webkit-user-select:none}
.text-word{display:inline-block;padding:2px 5px;margin:1px;border-radius:6px;cursor:pointer;transition:all .2s;border:1px solid transparent;color:var(--text)}
.text-word:hover{background:var(--accent-glow);border-color:var(--accent)}
.text-word.selected{background:linear-gradient(135deg,var(--accent),#7c6cf0);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(108,92,231,.3)}
.translated-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);margin-bottom:6px;transition:all .2s}
.translated-item:hover{border-color:var(--accent)}

@media(max-width:768px){.reading-toolbar{gap:3px;padding:8px}.reading-toolbar .btn{padding:6px 10px;font-size:.75rem;min-width:36px;min-height:36px}.reading-toolbar .search-box{width:120px;font-size:.75rem}.reading-dashboard{grid-template-columns:repeat(2,1fr)}.reading-content-area{font-size:.95rem;padding:14px;max-height:60vh}.reading-vocab-panel{max-height:50vh}}

/* ═══════════════════════════════════════════
   RICH BACK CARD SECTIONS

.rb-header{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}

.rb-note-box{font-size:.8rem;padding:8px 12px;background:rgba(0,184,148,.08);border:1px solid rgba(0,184,148,.2);border-radius:10px;color:var(--text);line-height:1.6;margin-bottom:12px;border-right:3px solid var(--success)}

.edit-advanced-fields textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
</style>

<body>
<div class="offline-banner" id="offlineBanner">⚡ شما آفلاین هستید - داده‌ها محلی ذخیره می‌شوند</div>
<a href="#content" class="skip-link">رد شدن به محتوا</a>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="sidebar-header"><div style="display:flex;align-items:center;justify-content:space-between"><div><h1>لایتنر</h1><p>مرور هوشمند واژگان</p></div><button type="button" class="theme-toggle" id="sidebarLockBtn" title="قفل سایدبار" style="width:32px;height:32px;font-size:.9rem">🔓</button></div></div>
<nav id="nav"></nav>
<div style="margin-top:auto;padding:16px 20px"><button class="theme-toggle" id="themeBtn" type="button" aria-label="تغییر پوسته">🌙</button></div>
</aside>
<main class="main" id="main">
<div class="topbar"><button class="hamburger" id="hamBtn" type="button" aria-label="منو">☰</button><h2 id="pageTitle"></h2><div class="topbar-actions" id="topActions"></div></div>
<div id="content"></div>
</main>
</div>
<div class="toast-container" id="toasts" aria-live="polite" aria-atomic="true"></div>
<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const MS_PER_DAY=86400000;
const PDF_DEFAULT_SCALE=1.5;
const PDF_THUMB_SCALE=0.2;
const FSRS_DECAY_COEFF=0.5;
const LIST_PAGE_SIZE=50;

// ═══════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════
const LS_KEY='leitner_v2';
const LS_BACKUP_KEY='leitner_backup';
const SCHEMA_VERSION=3;
function defaultState(){return{words:[],longTerm:[],stats:{reviewed:0,correct:0,wrong:0,streak:0,xp:0,lastReviewDate:null,history:{}},quizStats:{sessions:[],totalCorrect:0,totalWrong:0,wordPerformance:{},currentSession:null},categories:['پیش‌'],settings:{theme:'dark',sourceLang:'en',targetLang:'fa',notifications:false,notificationTime:'09:00',sidebarLocked:false,aiChat:{provider:'gemini',model:'gemini-2.0-flash',apiKey:'',apiKeys:{gemini:'',openrouter:'',groq:''},systemPrompt:'',temperature:0.7,maxTokens:2048,dailyLimit:250,dailyUsage:0,dailyUsageDate:'',connectionStatus:'disconnected',lastError:'',messages:[],chats:[],activeChat:null,providerUsage:null}},_version:SCHEMA_VERSION}}
let S=loadState();

function sanitizeCard(c){
  return{id:String(c.id||uid()),word:String(c.word||'').trim(),translation:String(c.translation||'').trim(),ipa:String(c.ipa||'').trim(),category:String(c.category||'پیش‌فرض').trim(),favorite:!!c.favorite,context:String(c.context||'').trim(),
  box:Math.max(0,Math.min(10,Number(c.box)||0)),repetitions:Math.max(0,Number(c.repetitions)||0),interval:Math.max(1,Number(c.interval)||1),easeFactor:Math.max(1.3,Number(c.easeFactor)||2.5),
  addedDate:c.addedDate||new Date().toISOString(),nextReviewDate:c.nextReviewDate||null,lastReviewedAt:c.lastReviewedAt||null,
  // FSRS fields
  stability:Number(c.stability)||0,difficulty:Number(c.difficulty)||0,elapsedDays:Number(c.elapsedDays)||0,scheduledDays:Number(c.scheduledDays)||0,reps:Number(c.reps)||0,lapses:Number(c.lapses)||0,fsrsState:String(c.fsrsState||'new'),
  // Dictionary details
  definitions:Array.isArray(c.definitions)?c.definitions:[],examples:Array.isArray(c.examples)?c.examples:[],synonyms:Array.isArray(c.synonyms)?c.synonyms:[],partOfSpeech:String(c.partOfSpeech||'').trim(),audioUs:String(c.audioUs||'').trim(),audioBr:String(c.audioBr||'').trim(),
  // Rich vocabulary fields
  coreMeaning:String(c.coreMeaning||'').trim(),collocations:Array.isArray(c.collocations)?c.collocations:[],antonyms:Array.isArray(c.antonyms)?c.antonyms:[],wordFamily:Array.isArray(c.wordFamily)?c.wordFamily:[],note:String(c.note||'').trim(),trap:String(c.trap||'').trim(),tags:Array.isArray(c.tags)?c.tags:[],source:String(c.source||'').trim()}
}

function loadState(){try{const d=localStorage.getItem(LS_KEY);if(!d)return defaultState();const p=JSON.parse(d);const s={...defaultState(),...p};s.words=(p.words||[]).map(sanitizeCard).filter(w=>w.word);s.longTerm=(p.longTerm||[]).map(sanitizeCard).filter(w=>w.word);s.stats={...defaultState().stats,...(p.stats||{})};if(Array.isArray(s.stats.history))s.stats.history={};s.quizStats={...defaultState().quizStats,...(p.quizStats||{})};if(!s.quizStats.wordPerformance)s.quizStats.wordPerformance={};if(!s.quizStats.sessions)s.quizStats.sessions=[];s.settings={...defaultState().settings,...(p.settings||{})};if(!s.settings.aiChat)s.settings.aiChat=defaultState().settings.aiChat;else{s.settings.aiChat={...defaultState().settings.aiChat,...s.settings.aiChat};if(!s.settings.aiChat.apiKeys)s.settings.aiChat.apiKeys={gemini:'',openrouter:'',groq:''};if(s.settings.aiChat.apiKey&&s.settings.aiChat.apiKeys[s.settings.aiChat.provider]===''){s.settings.aiChat.apiKeys[s.settings.aiChat.provider]=s.settings.aiChat.apiKey};if(!s.settings.aiChat.chats)s.settings.aiChat.chats=[];if(!s.settings.aiChat.activeChat)s.settings.aiChat.activeChat=null};return s}catch(e){return defaultState()}}
// Debounced save — batches rapid writes into one localStorage flush
let _saveTimer=null,_saveDirty=false;
function save(){
  _saveDirty=true;
  if(_saveTimer)clearTimeout(_saveTimer);
  _saveTimer=setTimeout(_doSave,300);
}
function _doSave(){
  _saveTimer=null;if(!_saveDirty)return;
  _saveDirty=false;
  try{localStorage.setItem(LS_KEY,JSON.stringify(S));rebuildIndex();autoBackup()}catch(e){toast('خطا در ذخیره‌سازی','error')}
}
// Force immediate save (for critical paths like page unload)
function saveNow(){if(_saveTimer){clearTimeout(_saveTimer);_saveTimer=null}_saveDirty=false;try{localStorage.setItem(LS_KEY,JSON.stringify(S));rebuildIndex()}catch(e){}}
// Warn on page close if there are unsaved changes
window.addEventListener('beforeunload',()=>{if(_saveDirty||_saveTimer){saveNow()}});
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtDate(d){if(!d)return'-';return new Date(d).toLocaleDateString('fa-IR')}
function todayKey(){return new Date().toISOString().slice(0,10)}

// ═══════════════════════════════════════════
// CARD FACTORY
// ═══════════════════════════════════════════
function createCard(overrides){
  return sanitizeCard(Object.assign({
    id:uid(),word:'',translation:'',ipa:'',category:'پیش‌فرض',
    favorite:false,context:'',
    box:0,repetitions:0,interval:1,easeFactor:2.5,
    addedDate:new Date().toISOString(),nextReviewDate:null,lastReviewedAt:null,
    stability:0,difficulty:0,elapsedDays:0,scheduledDays:0,
    reps:0,lapses:0,fsrsState:'new',
    definitions:[],examples:[],synonyms:[],partOfSpeech:'',
    audioUs:'',audioBr:'',
    coreMeaning:'',collocations:[],antonyms:[],wordFamily:[],
    note:'',trap:'',tags:[],source:''
  },overrides||{}))}

// ═══════════════════════════════════════════
// WORD LOOKUP INDEX (O(1) existence checks)
// ═══════════════════════════════════════════
let _wordsSet=null,_ltSet=null;
function rebuildIndex(){
  _wordsSet=new Set(S.words.map(function(w){return w.word.toLowerCase()}));
  _ltSet=new Set(S.longTerm.map(function(w){return w.word.toLowerCase()}))}
function wordExists(word){
  if(!_wordsSet)rebuildIndex();
  var w=word.toLowerCase();
  return _wordsSet.has(w)||_ltSet.has(w)}

// ═══════════════════════════════════════════
// STATE SNAPSHOT IMPORT/EXPORT HELPERS
// ═══════════════════════════════════════════
function sanitizeStateSnapshot(raw){
  if(!raw||typeof raw!=='object')return null;
  const s={...defaultState()};
  // Detect format
  const isFullSnapshot=raw.schema==='leitner-full-backup'||(Array.isArray(raw.words)&&(Array.isArray(raw.longTerm)||raw.longTerm===undefined));
  if(isFullSnapshot){
    s.words=(raw.words||[]).map(sanitizeCard).filter(w=>w.word);
    s.longTerm=(raw.longTerm||[]).map(sanitizeCard).filter(w=>w.word);
    if(raw.stats&&typeof raw.stats==='object'&&!Array.isArray(raw.stats)){
      s.stats={...defaultState().stats,...raw.stats};
      if(Array.isArray(s.stats.history))s.stats.history={};
    }
    if(Array.isArray(raw.categories))s.categories=raw.categories.filter(c=>typeof c==='string'&&c.trim());
    if(raw.settings&&typeof raw.settings==='object')s.settings={...defaultState().settings,...raw.settings};
    if(raw._version||raw.version)s._version=raw._version||raw.version;
    return{s,isFull:true};
  }
  // Legacy format: just words array or {words:[...]}
  let cards=[];
  if(Array.isArray(raw))cards=raw.filter(w=>w&&typeof w.word==='string'&&w.word.trim());
  else if(Array.isArray(raw.words))cards=raw.words.filter(w=>w&&typeof w.word==='string'&&w.word.trim());
  if(!cards.length)return null;
  return{cards,isFull:false};
}

function exportStateSnapshot(){
  return JSON.stringify({
    schema:'leitner-full-backup',
    version:SCHEMA_VERSION,
    exportedAt:new Date().toISOString(),
    words:S.words,
    longTerm:S.longTerm,
    stats:S.stats,
    categories:S.categories,
    settings:S.settings
  },null,2);
}

function importStateSnapshot(data){
  const result=sanitizeStateSnapshot(data);
  if(!result)return{ok:false,msg:'ساختار فایل معتبر نیست'};
  if(result.isFull){
    const existingWordIds=new Set(S.words.map(w=>w.id));
    const existingLTIds=new Set(S.longTerm.map(w=>w.id));
    const existingWordWords=new Set(S.words.map(w=>w.word.toLowerCase()));
    const existingLTWords=new Set(S.longTerm.map(w=>w.word.toLowerCase()));
    let addedWords=0,skippedWords=0;
    let addedLT=0,skippedLT=0;
    result.s.words.forEach(w=>{
      if(existingWordIds.has(w.id)||existingWordWords.has(w.word.toLowerCase())){skippedWords++;return}
      S.words.push(w);existingWordIds.add(w.id);existingWordWords.add(w.word.toLowerCase());addedWords++;
    });
    result.s.longTerm.forEach(w=>{
      if(existingLTIds.has(w.id)||existingLTWords.has(w.word.toLowerCase())){skippedLT++;return}
      S.longTerm.push(w);existingLTIds.add(w.id);existingLTWords.add(w.word.toLowerCase());addedLT++;
    });
    if(result.s.stats)S.stats={...result.s.stats,...S.stats,reviewed:(result.s.stats.reviewed||0)+0,correct:(result.s.stats.correct||0)+0,wrong:(result.s.stats.wrong||0)+0};
    if(result.s.categories&&result.s.categories.length){result.s.categories.forEach(c=>{if(!S.categories.includes(c))S.categories.push(c)})}
    if(result.s.settings)S.settings={...S.settings,...result.s.settings};
    save();
    const totalAdded=addedWords+addedLT;
    const totalSkipped=skippedWords+skippedLT;
    return{ok:true,msg:`${totalAdded} کلمه بازیابی شد (${addedWords} لایتنر، ${addedLT} حافظه بلندمدت)${totalSkipped?` — ${totalSkipped} تکراری رد شد`:''}`};
  }
  // Legacy import
  const existingWords=new Set(S.words.map(w=>w.word.toLowerCase()));
  const existingLT=new Set(S.longTerm.map(w=>w.word.toLowerCase()));
  const fresh=result.cards.filter(w=>!existingWords.has(w.word.toLowerCase())&&!existingLT.has(w.word.toLowerCase())).map(sanitizeCard);
  S.words.push(...fresh);save();
  return{ok:true,msg:`${fresh.length} کلمه وارد شد (${result.cards.length-fresh.length} تکراری رد شد)`};
}

// SHARED DECK FORMAT (lightweight, shareable)
// ═══════════════════════════════════════════
function exportSharedDeck(category){
  const words=S.words.filter(w=>!category||w.category===category);
  if(!words.length)return null;
  // Lightweight format: only essential fields
  const deck={
    v:1,
    name:category||'همه کلمات',
    lang:S.settings.sourceLang||'en',
    target:S.settings.targetLang||'fa',
    count:words.length,
    words:words.map(w=>({
      w:w.word,
      t:w.translation,
      ipa:w.ipa||undefined,
      pos:w.partOfSpeech||undefined,
      def:w.definitions&&w.definitions.length?w.definitions[0]:undefined,
      ex:w.examples&&w.examples.length?w.examples[0]:undefined,
      syn:w.synonyms&&w.synonyms.length?w.synonyms.slice(0,3):undefined,
      ant:w.antonyms&&w.antonyms.length?w.antonyms.slice(0,2):undefined
    }))
  };
  return deck;
}

function exportSharedDeckJSON(category){
  const deck=exportSharedDeck(category);
  if(!deck)return null;
  return JSON.stringify(deck);
}

function exportSharedDeckLink(category){
  const json=exportSharedDeckJSON(category);
  if(!json)return null;
  try{
    const encoded=btoa(unescape(encodeURIComponent(json)));
    const baseUrl=location.href.split('#')[0].split('?')[0];
    return baseUrl+'#deck='+encoded.slice(0,2000); // URL length limit
  }catch(e){return null}
}

function importSharedDeck(deck){
  if(!deck||!deck.words||!Array.isArray(deck.words))return{ok:false,msg:'ساختار دسته معتبر نیست'};
  let added=0,skipped=0;
  deck.words.forEach(item=>{
    const word=String(item.w||'').trim().toLowerCase();
    if(!word||wordExists(word)){skipped++;return}
    S.words.push(createCard({
      word:item.w,
      translation:item.t||'',
      ipa:item.ipa||'',
      partOfSpeech:item.pos||'',
      definitions:item.def?[item.def]:[],
      examples:item.ex?[item.ex]:[],
      synonyms:item.syn||[],
      antonyms:item.ant||[],
      category:deck.name||'مشترک',
      source:'shared-deck'
    }));
    added++;
  });
  save();
  return{ok:true,msg:`${added} کلمه از دسته «${deck.name||'مشترک'}» اضافه شد${skipped?` (${skipped} تکراری رد شد)`:''}`};
}

// Check URL hash for shared deck on load
function checkSharedDeckHash(){
  const hash=location.hash;
  if(!hash.startsWith('#deck='))return;
  try{
    const encoded=hash.slice(6);
    const json=decodeURIComponent(escape(atob(encoded)));
    const deck=JSON.parse(json);
    if(deck&&deck.words){
      const result=importSharedDeck(deck);
      if(result.ok){
        toast(result.msg,'success');
        // Clear hash to avoid re-import on refresh
        history.replaceState(null,'',location.pathname+location.search);
      }
    }
  }catch(e){toast('خطا در خواندن دسته مشترک','error')}
}

const LEADERBOARD_KEY='leitner_leaderboard';
const PLAYER_ID_KEY='leitner_player_id';

function getPlayerId(){
  let id=localStorage.getItem(PLAYER_ID_KEY);
  if(!id){id='player_'+uid();localStorage.setItem(PLAYER_ID_KEY,id)}
  return id;
}

function submitScore(){
  const lb=JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]');
  const playerId=getPlayerId();
  const existing=lb.findIndex(e=>e.id===playerId);
  const entry={
    id:playerId,
    xp:S.stats.xp,
    words:S.words.length+S.longTerm.length,
    accuracy:S.stats.reviewed>0?Math.round(S.stats.correct/S.stats.reviewed*100):0,
    streak:S.stats.streak,
    level:getLevel(S.stats.xp).name,
    ts:Date.now()
  };
  if(existing>=0)lb[existing]=entry;
  else lb.push(entry);
  // Keep top 50
  lb.sort((a,b)=>b.xp-a.xp);
  const trimmed=lb.slice(0,50);
  localStorage.setItem(LEADERBOARD_KEY,JSON.stringify(trimmed));
  return entry;
}

function getLeaderboard(){
  return JSON.parse(localStorage.getItem(LEADERBOARD_KEY)||'[]').sort((a,b)=>b.xp-a.xp);
}

function renderLeaderboard(){
  const lb=getLeaderboard();
  const playerId=getPlayerId();
  if(!lb.length)return'<p style="color:var(--text2);font-size:.85rem;text-align:center;padding:20px">هنوز امتیازی ثبت نشده</p>';
  let h='<div style="max-height:300px;overflow-y:auto">';
  lb.slice(0,20).forEach((e,i)=>{
    const isMe=e.id===playerId;
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1);
    h+='<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);'+(isMe?'background:var(--accent-glow);border-radius:8px;':'')+'">';
    h+='<span style="min-width:28px;text-align:center;font-size:1rem">'+medal+'</span>';
    h+='<div style="flex:1"><div style="font-size:.85rem;font-weight:'+(isMe?'700':'400')+'">'+(isMe?'شما':'بازیکن')+'</div>';
    h+='<div style="font-size:.7rem;color:var(--text2)">'+esc(e.level)+' • '+e.words+' کلمه • دقت '+e.accuracy+'%</div></div>';
    h+='<div style="text-align:left"><div style="font-size:.9rem;font-weight:700;color:var(--accent)">'+e.xp.toLocaleString()+' XP</div>';
    if(e.streak>0)h+='<div style="font-size:.65rem;color:var(--warning)">🔥 '+e.streak+' روز</div>';
    h+='</div></div>';
  });
  h+='</div>';
  return h;
}

// ═══════════════════════════════════════════
// FSRS ALGORITHM (self-contained, improved)
// ═══════════════════════════════════════════
// FSRS-5 weights (17 parameters) — tuned defaults
const FSRS_W=[0.4,0.6,2.4,5.8,4.93,0.94,0.86,0.01,1.49,0.14,0.94,2.18,0.05,0.34,1.26,0.29,2.61];
const FSRS_RETENTION=0.9;
const FSRS_MAX_INTERVAL=365;
const FSRS_DECAY=-0.5; // Power-law decay exponent

function fsrsRetrieveProbability(stability,elapsed){
  if(stability<=0)return 0;
  return Math.pow(1+elapsed/(FSRS_W[9]*stability),FSRS_DECAY);
}
function fsrsInitialDifficulty(rating){
  return Math.min(Math.max(FSRS_W[4]-Math.exp(FSRS_W[5]*(rating-1))+1,1),10);
}
function fsrsInitialStability(rating){return FSRS_W[rating-1]}

// Short-term stability model: after first learning step
function fsrsShortTermStability(stability,rating){
  // Stability boost for short-term reviews (same-day)
  return stability*Math.exp(FSRS_W[15]*(rating-3));
}

// Interval fuzzing: add ±5% jitter to prevent review clustering
function fuzzInterval(interval){
  if(interval<=2)return interval;
  const fuzzRange=Math.max(1,Math.round(interval*0.05));
  const fuzzed=interval+Math.floor(Math.random()*(2*fuzzRange+1))-fuzzRange;
  return Math.max(1,fuzzed);
}

function fsrsNext(w,rating){
  // rating: 1=Again,2=Hard,3=Good,4=Easy
  const state=w.fsrsState||'new';
  const now=new Date();
  let newStability,newDifficulty,newInterval,newState,newLapses=w.lapses||0;

  if(state==='new'||state==='learning'){
    // First encounter or still in learning phase
    if(rating===1){
      newStability=Math.max(FSRS_W[0],0.1);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=0; // Immediate retry
      newState='learning';
      newLapses=w.lapses||0;
    }else if(rating===2){
      // Hard: short stability, review tomorrow
      newStability=Math.max(FSRS_W[1]*1.2,0.2);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=1;
      newState='review';
    }else if(rating===3){
      // Good: standard initial stability
      newStability=Math.max(fsrsShortTermStability(FSRS_W[2],rating),0.5);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=Math.max(1,Math.round(FSRS_W[2]));
      newState='review';
    }else{
      // Easy: high initial stability
      newStability=Math.max(FSRS_W[3],1);
      newDifficulty=fsrsInitialDifficulty(rating);
      newInterval=Math.max(1,Math.round(FSRS_W[3]));
      newState='review';
    }
  }else if(state==='review'){
    const elapsed=w.elapsedDays||0;
    const retrievability=fsrsRetrieveProbability(w.stability,Math.max(elapsed,0));

    // Difficulty update: mean-reverting toward initial difficulty
    const difficultyDelta=-FSRS_W[6]*(rating-3);
    newDifficulty=Math.min(Math.max(w.difficulty+difficultyDelta,1),10);
    // Mean-reversion: difficulty trends back toward initial based on rating
    const initialD=fsrsInitialDifficulty(rating);
    newDifficulty=newDifficulty+FSRS_W[13]*(initialD-newDifficulty);

    if(rating===1){
      // Again: lapse, go to relearning
      newLapses=(w.lapses||0)+1;
      // Stability after lapse: penalized by retrievability
      const lapseStability=FSRS_W[11]*Math.pow(newDifficulty,-FSRS_W[12])*
        (Math.pow(w.stability+1,FSRS_W[13])-1)*
        Math.exp(FSRS_W[14]*(1-retrievability));
      newStability=Math.max(lapseStability,0.1);
      newInterval=1;
      newState='relearning';
    }else{
      // Hard/Good/Easy: stability growth
      const hardPenalty=rating===2?FSRS_W[15]:1;
      const easyBonus=rating===4?FSRS_W[16]:1;
      // Stability growth factor depends on difficulty, stability, and retrievability
      const stabilityGrowth=1+Math.exp(FSRS_W[7])*
        (11-newDifficulty)*
        Math.pow(w.stability,-FSRS_W[8])*
        (Math.exp(FSRS_W[10]*(1-retrievability))-1)*
        hardPenalty*easyBonus;
      newStability=Math.max(w.stability*stabilityGrowth,0.1);

      // Interval from stability with retention target
      if(rating===2)newInterval=Math.max(1,Math.round(w.interval*1.2));
      else if(rating===3)newInterval=Math.max(1,Math.round(newStability*FSRS_DECAY_COEFF*Math.log(FSRS_RETENTION)/Math.log(0.9)));
      else newInterval=Math.max(1,Math.round(newStability*FSRS_DECAY_COEFF*1.3));
      newState='review';
    }
  }else if(state==='relearning'){
    if(rating===1){
      newStability=Math.max(FSRS_W[0],0.1);
      newInterval=1;
      newState='relearning';
      newLapses=(w.lapses||0);
    }else{
      // Return to review
      newStability=Math.max(w.stability||FSRS_W[0],0.1);
      newDifficulty=w.difficulty||fsrsInitialDifficulty(rating);
      newInterval=1;
      newState='review';
      newLapses=w.lapses||0;
    }
  }else{
    // Unknown state, treat as new
    newStability=Math.max(FSRS_W[0],0.1);
    newDifficulty=fsrsInitialDifficulty(rating);
    newInterval=1;
    newState='learning';
    newLapses=0;
  }

  // Clamp values
  newStability=Math.max(newStability,0.1);
  newInterval=Math.min(Math.max(Math.round(newInterval),0),FSRS_MAX_INTERVAL);
  if(newInterval===0)newInterval=1;

  // Apply fuzzing to prevent review clustering
  newInterval=fuzzInterval(newInterval);

  // Update card
  w.stability=newStability;
  w.difficulty=newDifficulty;
  w.interval=newInterval;
  w.fsrsState=newState;
  w.lapses=newLapses;
  w.reps=(w.reps||0)+1;
  w.elapsedDays=0;
  w.scheduledDays=newInterval;
  w.nextReviewDate=new Date(now.getTime()+newInterval*MS_PER_DAY).toISOString();
  w.lastReviewedAt=now.toISOString();
  w.box=Math.min(10,Math.ceil(newStability/30));
  w.easeFactor=Math.max(1.3,3-newDifficulty/5);
  return w;
}

function clampReviewValues(w){
  w.repetitions=Math.max(0,Number(w.repetitions)||0);
  w.interval=Math.max(1,Number(w.interval)||1);
  w.easeFactor=Math.max(1.3,Number(w.easeFactor)||2.5);
  w.box=Math.max(0,Math.min(10,Number(w.box)||0));
  if(w.nextReviewDate&&isNaN(new Date(w.nextReviewDate).getTime()))w.nextReviewDate=null;
  if(w.lastReviewedAt&&isNaN(new Date(w.lastReviewedAt).getTime()))w.lastReviewedAt=null;
  // Ensure FSRS fields exist
  if(w.stability===undefined)w.stability=0;
  if(w.difficulty===undefined)w.difficulty=0;
  if(w.fsrsState===undefined)w.fsrsState='new';
}

function sm2Legacy(w,q){
  clampReviewValues(w);
  const now=Date.now();
  if(q<3){w.repetitions=0;w.interval=1}
  else{w.repetitions++;if(w.repetitions===1)w.interval=1;else if(w.repetitions===2)w.interval=6;else w.interval=Math.round(w.interval*w.easeFactor)}
  w.easeFactor+=(0.1-(5-q)*(0.08+(5-q)*0.02));
  if(w.easeFactor<1.3)w.easeFactor=1.3;
  w.nextReviewDate=new Date(now+w.interval*MS_PER_DAY).toISOString();
  w.lastReviewedAt=new Date(now).toISOString();
  w.box=Math.min(10,w.repetitions);
  return w}

// Map old 1-5 rating to FSRS 1-4
function mapRating(q){return q<=1?1:q<=3?2:q===4?3:4}

const DICT_API='https://api.dictionaryapi.dev/api/v2/entries/en';

function decodeHtmlEntities(str){

async function fetchDictionary(word){
  try{
    const r=await fetch(DICT_API+'/'+encodeURIComponent(word),{headers:{Accept:'application/json'}});
    if(!r.ok)return null;
    const data=await r.json();
    if(!Array.isArray(data)||!data[0])return null;
    const e=data[0];
    const phonetics=Array.isArray(e.phonetics)?e.phonetics:[];
    const phoneticBr=phonetics.filter(p=>typeof p.audio==='string'&&/-uk\.mp3/i.test(p.audio)).map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const phoneticUs=phonetics.filter(p=>typeof p.audio==='string'&&/-us\.mp3/i.test(p.audio)).map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const audioBr=phonetics.filter(p=>typeof p.audio==='string'&&/-uk\.mp3/i.test(p.audio)).map(p=>p.audio).find(Boolean)||null;
    const audioUs=phonetics.filter(p=>typeof p.audio==='string'&&/-us\.mp3/i.test(p.audio)).map(p=>p.audio).find(Boolean)||null;
    const phonetic=phoneticBr||phoneticUs||phonetics.map(p=>typeof p.text==='string'?p.text.trim():'').find(Boolean)||null;
    const meanings=(Array.isArray(e.meanings)?e.meanings:[]).slice(0,4).map(m=>{
      const defs=(Array.isArray(m.definitions)?m.definitions:[]).slice(0,3).map(d=>typeof d.definition==='string'?d.definition.trim():'').filter(Boolean);
      const examples=(Array.isArray(m.definitions)?m.definitions:[]).slice(0,2).map(d=>typeof d.example==='string'?d.example.trim():'').filter(Boolean);
      const synonyms=[...(Array.isArray(m.synonyms)?m.synonyms:[]),...(Array.isArray(m.definitions)?m.definitions:[]).flatMap(d=>Array.isArray(d.synonyms)?d.synonyms:[])].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4).filter(s=>typeof s==='string').map(s=>s.trim());
      return{partOfSpeech:m.partOfSpeech||'',definitions:defs,examples,synonyms}});
    return{headword:e.word||word,phonetic,phoneticBr,phoneticUs,audioBr,audioUs,meanings}
  }catch(e){return null}}

async function fetchTranslation(word,fromLang,toLang){
  try{
    const langpair=(fromLang||S.settings.sourceLang||'en')+'|'+(toLang||S.settings.targetLang||'fa');
    const r=await fetch(MYMEMORY_API+'?q='+encodeURIComponent(word)+'&langpair='+langpair);
    if(!r.ok)return null;
    const d=await r.json();
    if(d.responseData&&d.responseData.translatedText){
      let t=d.responseData.translatedText;
      if(t.toUpperCase()===word.toUpperCase())return null;
      return decodeHtmlEntities(t)}
    return null
  }catch(e){return null}}

// ETYMOLOGY (Wiktionary API)
// ═══════════════════════════════════════════
async function fetchEtymology(word){
  try{
    const r=await fetch('https://en.wiktionary.org/api/rest_v1/page/etymology/'+encodeURIComponent(word));
    if(!r.ok)return null;
    const data=await r.json();
    if(data&&data.extract)return data.extract;
    // Fallback: try the definition endpoint
    const r2=await fetch('https://en.wiktionary.org/api/rest_v1/definition/'+encodeURIComponent(word));
    if(!r2.ok)return null;
    const data2=await r2.json();
    if(data2&&data2.en&&data2.en[0]&&data2.en[0].etymology)return data2.en[0].etymology;
    return null;
  }catch(e){return null}
}

// ═══════════════════════════════════════════
// MORPHOLOGICAL FAMILY (word forms)
// ═══════════════════════════════════════════
const MORPH_SUFFIXES={
  verb:['ing','ed','es','s','er','ers','tion','ment','ance','ence','ive','able','ible'],
  noun:['s','es','tion','ment','ance','ence','ist','ism','ity','ness','er','or','age','ure','dom','ship'],
  adj:['ly','ness','er','est','ity','ism','ize','ise','ful','less','ous','ive','able','ible','al','ial'],
  adv:['ly','ness']
};

function getMorphologicalFamily(word){
  const w=word.toLowerCase();
  const family=new Set();
  family.add(w);
  // Strip common suffixes to find root
  for(const suffixes of Object.values(MORPH_SUFFIXES)){
    for(const s of suffixes){
      if(w.endsWith(s)&&w.length>s.length+2){
        const root=w.slice(0,-s.length);
        family.add(root);
        // Generate common forms from root
        family.add(root+'ing');family.add(root+'ed');family.add(root+'s');
        family.add(root+'tion');family.add(root+'ment');family.add(root+'ness');
        family.add(root+'ly');family.add(root+'er');family.add(root+'est');
        family.add(root+'ful');family.add(root+'less');family.add(root+'ous');
        family.add(root+'ive');family.add(root+'able');family.add(root+'ist');
        family.add(root+'ism');family.add(root+'ity');family.add(root+'ize');
        break;
      }
    }
  }
  // Also check if word itself is a root
  if(w.length>=3){
    family.add(w+'ing');family.add(w+'ed');family.add(w+'s');
    family.add(w+'tion');family.add(w+'ment');family.add(w+'ness');
    family.add(w+'ly');family.add(w+'er');family.add(w+'ful');
    family.add(w+'less');family.add(w+'ous');family.add(w+'ive');
    family.add(w+'able');family.add(w+'ist');family.add(w+'ism');
  }
  family.delete(w); // remove the word itself
  return[...family].filter(f=>f.length>=3).slice(0,12);
}

// COLLOCATION SUGGESTIONS
// ═══════════════════════════════════════════
const COMMON_COLLOCATIONS={
  make:['a decision','a mistake','progress','effort','money','sense','a difference','a choice'],
  take:['a break','a chance','action','place','care','advantage','responsibility','notes'],
  do:['homework','damage','business','research','well','harm','justice','a favor'],
  have:['an effect','an impact','a chance','difficulty','access','fun','a look','a problem'],
  get:['rid of','used to','better','worse','along','away','over','through'],
  give:['up','in','away','birth','rise','permission','advice','priority'],
  break:['a rule','a record','the law','down','even','the ice','news','free'],
  keep:['track of','up','in mind','quiet','away','going','pace','score'],
  pay:['attention','a visit','tribute','off','back','for','the price','respect'],
  run:['out of','into','a risk','a business','smoothly','across','over','away'],
  turn:['out','into','down','up','around','off','over','away'],
  put:['forward','on','off','up with','down','out','aside','pressure'],
  come:['across','up with','true','first','to terms','into play','alive','clean'],
  go:['through','ahead','over','wrong','back','on','for','without'],
  set:['up','off','out','back','in','apart','fire','free'],
  bring:['about','up','out','in','back','to light','to an end','together'],
  carry:['out','on','away','through','over','weight','off','forward']
};

function suggestCollocations(word){
  const w=word.toLowerCase();
  if(COMMON_COLLOCATIONS[w])return COMMON_COLLOCATIONS[w];
  // Check if word appears in any collocation
  const suggestions=[];
  for(const[verb,colls]of Object.entries(COMMON_COLLOCATIONS)){
    for(const c of colls){
      if(c.includes(w))suggestions.push(verb+' '+c);
    }
  }
  return suggestions.slice(0,5);
}

// ═══════════════════════════════════════════
// FREQUENCY RANK (COCA-based approximate)
// ═══════════════════════════════════════════
function getFrequencyRank(word){
  const w=word.toLowerCase();
  // Approximate COCA rank from tier membership
  if(FREQ_T1.has(w)){
    // Top 500: assign position within set
    const t1Arr=[...FREQ_T1];
    const idx=t1Arr.indexOf(w);
    return idx>=0?idx+1:250;
  }
  if(FREQ_T2.has(w))return 500+Math.floor(Math.random()*500);
  if(FREQ_T3.has(w))return 1000+Math.floor(Math.random()*4000);
  return null; // not in top 5000
}

// ENHANCED DICTIONARY POPUP (with etymology + frequency)
// ═══════════════════════════════════════════
// Enhance fetchDictionary to also return etymology and morphological data
const _origFetchDictionary=fetchDictionary;
fetchDictionary=async function(word){
  const result=await _origFetchDictionary(word);
  if(!result)return result;
  // Add etymology (parallel, non-blocking)
  try{
    const etym=await fetchEtymology(word);
    if(etym)result.etymology=etym;
  }catch(e){}
  // Add morphological family
  result.morphFamily=getMorphologicalFamily(word);
  // Add frequency rank
  result.freqRank=getFrequencyRank(word);
  return result;
};

// AUTO-BACKUP (IndexedDB) — versioned snapshots
// ═══════════════════════════════════════════
const BACKUP_STORE='backups';
const BACKUP_META_STORE='backup_meta';
const MAX_BACKUPS=10;
let backupDb=null;
let _backupCounter=0;

function openBackupDb(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open('leitner_backup_db',2);
    req.onupgradeneeded=(e)=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(BACKUP_STORE))db.createObjectStore(BACKUP_STORE);
      if(!db.objectStoreNames.contains(BACKUP_META_STORE))db.createObjectStore(BACKUP_META_STORE);
    };
    req.onsuccess=()=>{backupDb=req.result;resolve(req.result)};
    req.onerror=()=>reject(req.error)});
}

async function autoBackup(){
  _backupCounter++;
  // Backup every 20 saves (not every single save)
  if(_backupCounter<20)return;
  _backupCounter=0;
  try{
    const db=backupDb||await openBackupDb();
    const now=new Date();
    const ts=now.toISOString();
    const snapshot=JSON.stringify(S);
    const tx=db.transaction([BACKUP_STORE,BACKUP_META_STORE],'readwrite');
    // Save snapshot with timestamp key
    const key='snap_'+ts;
    tx.objectStore(BACKUP_STORE).put(snapshot,key);
    // Update meta: list of snapshot keys + pointer to latest
    const metaStore=tx.objectStore(BACKUP_META_STORE);
    metaStore.put(ts,'latest_ts');
    const metaReq=metaStore.get('snapshot_keys');
    metaReq.onsuccess=()=>{
      let keys=metaReq.result||[];
      keys.push(key);
      // Prune old snapshots beyond MAX_BACKUPS
      while(keys.length>MAX_BACKUPS){
        const old=keys.shift();
        try{tx.objectStore(BACKUP_STORE).delete(old)}catch(e){}}
      metaStore.put(keys,'snapshot_keys');
    };
  }catch(e){}}

// Get list of available snapshots
async function listSnapshots(){
  try{
    const db=backupDb||await openBackupDb();
    return new Promise(resolve=>{
      const tx=db.transaction(BACKUP_META_STORE,'readonly');
      const req=tx.objectStore(BACKUP_META_STORE).get('snapshot_keys');
      req.onsuccess=()=>resolve((req.result||[]).reverse());
      req.onerror=()=>resolve([])});
  }catch(e){return[]}}

// Restore a specific snapshot by key
async function restoreSnapshot(key){
  try{
    const db=backupDb||await openBackupDb();
    return new Promise((resolve,reject)=>{
      const tx=db.transaction(BACKUP_STORE,'readonly');
      const req=tx.objectStore(BACKUP_STORE).get(key);
      req.onsuccess=()=>{try{resolve(JSON.parse(req.result))}catch(e){resolve(null)}};
      req.onerror=()=>resolve(null)});
  }catch(e){return null}}

// Get latest snapshot (backward compat)
async function exportBackup(){
  try{
    const db=backupDb||await openBackupDb();
    const tsTx=db.transaction(BACKUP_META_STORE,'readonly');
    const tsReq=tsTx.objectStore(BACKUP_META_STORE).get('latest_ts');
    return new Promise(resolve=>{
      tsReq.onsuccess=()=>{
        const ts=tsReq.result;
        if(!ts){resolve(null);return}
        const key='snap_'+ts;
        const tx=db.transaction(BACKUP_STORE,'readonly');
        const req=tx.objectStore(BACKUP_STORE).get(key);
        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>resolve(null)};
      tsReq.onerror=()=>resolve(null)});
  }catch(e){return null}}

// Legacy compat: restoreBackup returns latest
async function restoreBackup(){
  try{
    const data=await exportBackup();
    return data?JSON.parse(data):null;
  }catch(e){return null}}

// Delete a specific snapshot
async function deleteSnapshot(key){
  try{
    const db=backupDb||await openBackupDb();
    const tx=db.transaction([BACKUP_STORE,BACKUP_META_STORE],'readwrite');
    tx.objectStore(BACKUP_STORE).delete(key);
    const metaReq=tx.objectStore(BACKUP_META_STORE).get('snapshot_keys');
    metaReq.onsuccess=()=>{
      let keys=(metaReq.result||[]).filter(k=>k!==key);
      tx.objectStore(BACKUP_META_STORE).put(keys,'snapshot_keys');
    };
  }catch(e){}}

function rateReview(q){
if(reviewRatingPending)return;
reviewRatingPending=true;
const w=reviewSession.queue[reviewSession.idx];
const idx=S.words.findIndex(x=>x.id===w.id);
if(idx>=0)fsrsNext(S.words[idx],mapRating(q));
S.stats.reviewed++;S.stats.xp+={1:0,2:3,3:5,4:8,5:10}[q]||0;
if(q>=4)S.stats.correct++;else S.stats.wrong++;
const dk=todayKey();if(S.stats.lastReviewDate!==dk){if(S.stats.lastReviewDate===new Date(Date.now()-MS_PER_DAY).toISOString().slice(0,10))S.stats.streak++;else S.stats.streak=1;S.stats.lastReviewDate=dk}
if(!S.stats.history[dk])S.stats.history[dk]={reviewed:0,correct:0,wrong:0};
S.stats.history[dk].reviewed++;if(q>=4)S.stats.history[dk].correct++;else S.stats.history[dk].wrong++;
save();
reviewSession.idx++;reviewSession.flipped=false;
if(reviewSession.idx>=reviewSession.queue.length)reviewSession.done=true;
reviewRatingPending=false;
renderReview(document.getElementById('content'))}

let libFilter='',libCat='',libSort='',libPage=0,libTag='',_libSearchTimer=null;
const LIB_PAGE_SIZE=50;

function getLibFiltered(){
const key=libFilter+'|'+libCat+'|'+libSort+'|'+libTag;
if(_libCache&&_libCacheKey===key)return _libCache;
const words=S.words;
const filtered=words.filter(w=>{if(libCat&&w.category!==libCat)return false;if(libTag&&!(w.tags||[]).includes(libTag))return false;if(libFilter&&!w.word.toLowerCase().includes(libFilter.toLowerCase())&&!w.translation.toLowerCase().includes(libFilter.toLowerCase()))return false;return true});
if(libSort==='newest')filtered.sort((a,b)=>new Date(b.addedDate)-new Date(a.addedDate));
else if(libSort==='due')filtered.sort((a,b)=>{const da=a.nextReviewDate?new Date(a.nextReviewDate):new Date('2099-01-01');const db=b.nextReviewDate?new Date(b.nextReviewDate):new Date('2099-01-01');return da-db});
else if(libSort==='alpha')filtered.sort((a,b)=>a.word.localeCompare(b.word,'fa'));
else if(libSort==='freq')filtered.sort((a,b)=>getFrequencyTier(a.word)-getFrequencyTier(b.word));
_libCache=filtered;_libCacheKey=key;return filtered}

function makePagerHtml(total,page,pageSize,pgClass,pgAttr){
const pages=Math.ceil(total/pageSize);if(pages<=1)return'';
let h='<div class="lib-pager '+pgClass+'">';
h+='<button type="button" class="btn btn-ghost btn-sm '+pgClass+'" data-'+pgAttr+'="prev" '+(page===0?'disabled':'')+'>◀</button>';
const s=Math.max(0,page-2),e=Math.min(pages,page+3);
if(s>0)h+='<button type="button" class="btn btn-ghost btn-sm '+pgClass+'" data-'+pgAttr+'="0">1</button>';
if(s>1)h+='<span class="lib-pg-ellipsis">…</span>';
for(let i=s;i<e;i++)h+='<button type="button" class="btn btn-sm '+pgClass+(i===page?' lib-pg-active':'')+'" data-'+pgAttr+'="'+i+'">'+(i+1)+'</button>';
if(e<pages-1)h+='<span class="lib-pg-ellipsis">…</span>';
if(e<pages)h+='<button type="button" class="btn btn-ghost btn-sm '+pgClass+'" data-'+pgAttr+'="'+(pages-1)+'">'+pages+'</button>';
h+='<button type="button" class="btn btn-ghost btn-sm '+pgClass+'" data-'+pgAttr+'="next" '+(page>=pages-1?'disabled':'')+'>▶</button>';
h+='</div>';return h}
function paginate(total,page,pageSize){const pages=Math.ceil(total/pageSize);if(page>=pages)page=Math.max(0,pages-1);const start=page*pageSize;return{start,end:start+pageSize,totalPages:pages}}

function showDeckManager(){
  const ov=document.createElement('div');ov.className='modal-overlay';
  function renderDeckModal(){
    const deckStats=S.categories.map(cat=>{
      const words=S.words.filter(w=>w.category===cat);
      const due=words.filter(w=>w.nextReviewDate&&new Date(w.nextReviewDate)<=new Date()).length;
      const mastered=words.filter(w=>w.box>=5).length;
      return{name:cat,count:words.length,due,mastered};
    });
    ov.innerHTML=`<div class="modal" style="max-width:500px">
      <h3 style="margin-bottom:16px">🗂️ مدیریت دسته‌ها (Deck)</h3>
      <div style="margin-bottom:16px;display:flex;gap:8px">
        <input class="input" id="newDeckName" placeholder="نام دسته جدید" style="flex:1">
        <button type="button" class="btn btn-primary btn-sm" id="addDeckBtn">افزودن</button>
      </div>
      <div style="max-height:400px;overflow-y:auto">
        ${deckStats.map(d=>`
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border)">
            <div>
              <strong>${esc(d.name)}</strong>
              <span style="color:var(--text2);font-size:.8rem;margin-right:8px">${d.count} کلمه ${d.due>0?`• <span style="color:var(--warning)">${d.due} قابل مرور</span>`:''} ${d.mastered>0?`• <span style="color:var(--success)">${d.mastered} تثبیت</span>`:''}</span>
            </div>
            <div style="display:flex;gap:4px">
              ${d.name!=='پیش‌فرض'?`<button type="button" class="btn btn-ghost btn-sm" data-rename="${esc(d.name)}" title="تغییر نام">✏️</button><button type="button" class="btn btn-ghost btn-sm" data-deldeck="${esc(d.name)}" title="حذف دسته" style="color:var(--danger)">🗑️</button>`:''}
            </div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:16px;text-align:left">
        <button type="button" class="btn btn-ghost" id="closeDeckMgr">بستن</button>
      </div>
    </div>`;
    ov.querySelector('#addDeckBtn').onclick=()=>{
      const name=ov.querySelector('#newDeckName').value.trim();
      if(!name)return;
      if(S.categories.includes(name)){toast('این دسته قبلاً وجود دارد','error');return}
      S.categories.push(name);save();renderDeckModal();toast('دسته «'+name+'» اضافه شد','success');
    };
    ov.querySelector('#newDeckName').onkeydown=(e)=>{if(e.key==='Enter')ov.querySelector('#addDeckBtn').click()};
    ov.querySelectorAll('[data-deldeck]').forEach(btn=>{
      btn.onclick=()=>{
        const name=btn.dataset.deldeck;
        if(!confirm('حذف دسته «'+name+'»؟ کلمات آن به پیش‌فرض منتقل می‌شوند.'))return;
        S.words.forEach(w=>{if(w.category===name)w.category='پیش‌فرض'});
        S.categories=S.categories.filter(c=>c!==name);
        if(!S.categories.includes('پیش‌فرض'))S.categories.unshift('پیش‌فرض');
        save();renderDeckModal();toast('دسته حذف شد','success');
      };
    });
    ov.querySelectorAll('[data-rename]').forEach(btn=>{
      btn.onclick=()=>{
        const oldName=btn.dataset.rename;
        const newName=prompt('نام جدید برای «'+oldName+'»:',oldName);
        if(!newName||newName.trim()===oldName)return;
        S.categories=S.categories.map(c=>c===oldName?newName.trim():c);
        S.words.forEach(w=>{if(w.category===oldName)w.category=newName.trim()});
        save();renderDeckModal();toast('نام تغییر کرد','success');
      };
    });
    ov.querySelector('#closeDeckMgr').onclick=()=>{ov.remove();renderLibrary(document.getElementById('content'))};
  }
  renderDeckModal();
  document.body.appendChild(ov);
  ov.onclick=e=>{if(e.target===ov){ov.remove();renderLibrary(document.getElementById('content'))}};
}

// 3. LONG-TERM MEMORY (with pagination)
// ═══════════════════════════════════════════
let ltFilter='',ltTagFilter='',ltSourceFilter='',ltPage=0;
const LT_PAGE_SIZE=50;
let _ltCache=null,_ltCacheKey='';
function getLtFiltered(){
const key=ltFilter+'|'+ltTagFilter+'|'+ltSourceFilter;
if(_ltCache&&_ltCacheKey===key)return _ltCache;
const items=S.longTerm.filter(w=>{
  if(ltFilter&&!w.word.toLowerCase().includes(ltFilter.toLowerCase())&&!w.translation.toLowerCase().includes(ltFilter.toLowerCase()))return false;
  if(ltTagFilter&&!(w.tags||[]).includes(ltTagFilter))return false;
  if(ltSourceFilter&&w.source!==ltSourceFilter)return false;
  return true;
});
_ltCache=items;_ltCacheKey=key;return items}
function invalidateLtCache(){_ltCache=null;_ltCacheKey=''}
function ltRowHtml(w){
return '<tr><td><strong>'+esc(w.word)+'</strong>'+(w.ipa?'<br><small style="color:var(--text2)">'+esc(w.ipa)+'</small>':'')+' <button type="button" class="btn btn-ghost btn-sm" data-speak="'+esc(w.word)+'" style="padding:2px 6px;font-size:.75rem" title="شنیدن تلفظ">🔊</button></td><td>'+esc(w.translation)+'</td><td>'+(w.tags||[]).map(function(t){return '<span class="tag" style="font-size:.6rem">'+esc(t)+'</span>'}).join(' ')+(w.source?'<br><small style="color:var(--text2);font-size:.65rem">'+esc(w.source)+'</small>':'')+'</td><td><button type="button" class="btn btn-ghost btn-sm" data-ltedit="'+w.id+'" aria-label="ویرایش">✏️</button><button type="button" class="btn btn-ghost btn-sm" data-back="'+w.id+'" aria-label="بازگشت به کتابخانه">↩️ بازگشت</button><button type="button" class="btn btn-ghost btn-sm" data-dlt="'+w.id+'" aria-label="حذف">🗑️</button></td></tr>'}
function ltPagerHtml(total,page,pageSize){return makePagerHtml(total,page,pageSize,'lt-pg','ltpg')}
function renderLongterm(c){
const allTags=new Set();const allSources=new Set();
S.longTerm.forEach(function(w){(w.tags||[]).forEach(function(t){allTags.add(t)});if(w.source)allSources.add(w.source)});
const items=getLtFiltered();
const tagOpts=[...allTags].sort().map(function(t){return '<option value="'+esc(t)+'"'+(t===ltTagFilter?' selected':'')+'>'+esc(t)+'</option>'}).join('');
const srcOpts=[...allSources].sort().map(function(s){return '<option value="'+esc(s)+'"'+(s===ltSourceFilter?' selected':'')+'>'+esc(s)+'</option>'}).join('');
const total=items.length;
const p=paginate(total,ltPage,LT_PAGE_SIZE);ltPage=Math.min(ltPage,Math.max(0,p.totalPages-1));
const pageItems=items.slice(p.start,p.end);
c.innerHTML='<div class="filter-bar"><input class="input" placeholder="جستجو..." style="max-width:250px" value="'+esc(ltFilter)+'" id="ltSearch"><select class="input" style="max-width:160px" id="ltTagFilter"><option value="">همه برچسب‌ها</option>'+tagOpts+'</select><select class="input" style="max-width:180px" id="ltSourceFilter"><option value="">همه منابع</option>'+srcOpts+'</select><span style="color:var(--text2);font-size:.85rem">'+total+' کلمه'+(total!==S.longTerm.length?' (از '+S.longTerm.length+')':'')+'</span></div>'+ltPagerHtml(total,ltPage,LT_PAGE_SIZE)+'<div class="table-wrap card"><table><thead><tr><th>کلمه</th><th>ترجمه</th><th>برچسب‌ها</th><th>عملیات</th></tr></thead><tbody>'+(pageItems.length?pageItems.map(ltRowHtml).join(''):'<tr><td colspan="4"><div class="empty"><div class="icon">🧠</div><p>هنوز کلمه‌ای به حافظه بلندمدت منتقل نشده</p><p style="color:var(--text2);font-size:.8rem;margin-top:8px">کلمات تثبیت شده را از کتابخانه به حافظه بلندمدت منتقل کنید</p></div></td></tr>')+'</tbody></table></div>';
document.getElementById('ltSearch').oninput=function(e){ltFilter=e.target.value;ltPage=0;invalidateLtCache();renderLongterm(c)};
document.getElementById('ltTagFilter').onchange=function(e){ltTagFilter=e.target.value;ltPage=0;invalidateLtCache();renderLongterm(c)};
document.getElementById('ltSourceFilter').onchange=function(e){ltSourceFilter=e.target.value;ltPage=0;invalidateLtCache();renderLongterm(c)};
c.querySelector('tbody').onclick=function(e){
var btn=e.target.closest('button');if(!btn)return;
if(btn.dataset.speak){speakWord(btn.dataset.speak);return}
if(btn.dataset.back){var w=S.longTerm.find(function(x){return x.id===btn.dataset.back});if(w){S.longTerm=S.longTerm.filter(function(x){return x.id!==w.id});w.box=1;w.nextReviewDate=null;S.words.push(w);save();invalidateLtCache();invalidateLibCache();renderLongterm(c);toast('بازگشت به کتابخانه','success')}}
if(btn.dataset.dlt){var w=S.longTerm.find(function(x){return x.id===btn.dataset.dlt});var name=w?w.word:'';if(!confirm('\u062d\u0630\u0641 \u00ab'+name+'\u00bb\u061f'))return;S.longTerm=S.longTerm.filter(function(x){return x.id!==btn.dataset.dlt});save();invalidateLtCache();renderLongterm(c);toast('\u062d\u0630\u0641 \u0634\u062f','success')}};
bindPager(c,null,function(v){ltPage=v==='prev'?Math.max(0,ltPage-1):v==='next'?ltPage+1:parseInt(v);renderLongterm(c)});
}

let importStep=0,importRawText='',importWords=[],importExisting=new Set(),importSelected=new Set(),importTranslations=[],importCategory='پیش‌فرض',importFilter='all',importTransProgress={done:0,total:0};

function calcImportStats(){
const unique=[...new Set(importWords)];

return{total:importWords.length,unique:unique.length,existing:unique.length-newW.length,newCount:newW.length}}

function renderImportSteps(){

h+='</div>';return h}

const arr=await Promise.all([fetchTranslation(w.word),fetchDictionary(w.word)]);
const transResult=arr[0],dictResult=arr[1];
const allDefs=dictResult?dictResult.meanings.flatMap(m=>m.definitions):[];

translatedItems.push(...results);

// ═══════════════════════════════════════════
// DOCX TABLE STRUCTURED PARSER
// ═══════════════════════════════════════════
const DOCX_NS='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function getDocxCellText(tc){
  const ns=DOCX_NS;
  const ps=tc.querySelectorAll('p');
  const lines=[];
  for(const p of ps){
    const runs=p.querySelectorAll('t');
    let line='';
    for(const t of runs) line+=t.textContent;
    lines.push(line.trim());
  }
  return lines.join('\n');
}
function parseDocxTableStructured(zip){
  return new Promise(async (resolve,reject)=>{
    try{
      const xml=await zip.file('word/document.xml').async('text');
      const parser=new DOMParser();
      const doc=parser.parseFromString(xml,'text/xml');
      const tables=doc.querySelectorAll('tbl');
      if(!tables.length){resolve([]);return}
      const table=tables[0];
      const rows=table.querySelectorAll('tr');
      const cards=[];
      for(let i=1;i<rows.length;i++){
        const cells=rows[i].querySelectorAll('tc');
        if(cells.length<6) continue;
        const col0=getDocxCellText(cells[0]);
        const col1=getDocxCellText(cells[1]);
        const col2=getDocxCellText(cells[2]);
        const col3=getDocxCellText(cells[3]);
        const col4=getDocxCellText(cells[4]);
        const col5=getDocxCellText(cells[5]);
        let word='',pos='',pronunciation='';
        const wordMatchWithPos=col0.match(/^([a-zA-Z']+)\s*\((verb|noun|adj|adv|adjective|adverb|preposition|interjection|conjunction|pronoun|determiner|noun,\s*verb|verb,\s*noun)\)\s*\n?\s*(.*)/i);
        const wordMatchPlain=col0.match(/^([a-zA-Z']+)$/);
        if(wordMatchWithPos){word=wordMatchWithPos[1].toLowerCase();pos=wordMatchWithPos[2].toLowerCase().replace(/,\s*\w+/g,'');pronunciation=wordMatchWithPos[3]?wordMatchWithPos[3].trim():''}
        else if(wordMatchPlain){word=wordMatchPlain[1].toLowerCase()}
        else continue;
        const translation=col1.trim();
        const coreMeaning=col2.trim();
        const synonyms=col4.split(/[;,]/).map(s=>s.trim()).filter(s=>s.length>1&&s.length<40);
        const antonyms=col5.split(/[;,]/).map(s=>s.trim()).filter(s=>s.length>1&&s.length<40);
        // Collect following metadata rows
        let examples='',context='',note='',trap='';
        for(let j=i+1;j<rows.length;j++){
          const mc=rows[j].querySelectorAll('tc');
          if(mc.length<2) break;
          const label=getDocxCellText(mc[0]);
          const content=getDocxCellText(mc[1]);
          if(label.match(/Example/i)){examples=content}
          else if(label.match(/Context/i)){context=content}
          else if(label.match(/Note|Trap/i)){
            const trapMatch=content.match(/Trap\s*:?\s*(.+)/i);
            if(trapMatch){trap=trapMatch[1].trim();note=content.replace(/Trap\s*:?\s*.*/i,'').replace(/Note\s*:?\s*/i,'').trim()}
            else{note=content.replace(/Note\s*:?\s*/i,'').trim()}
          }
          else if(label.match(/\(verb|noun|adj|adv|adverb|preposition|interjection|conjunction|pronoun|determiner/i)||/^[a-zA-Z']+$/.test(label)) break;
          else break;
        }
        cards.push({
          id:uid()+'_'+word.replace(/[^a-z0-9]/g,''),
          word,translation,ipa:pronunciation,partOfSpeech:pos,
          coreMeaning,definitions:coreMeaning?[coreMeaning]:[],
          examples:examples?examples.split(/[.!?]\s+(?=[A-Z])/).map(s=>s.trim()).filter(s=>s.length>5).slice(0,3):[],
          context:context.slice(0,300),
          collocations:context.split(/[;,]/).map(s=>s.trim()).filter(s=>s.length>2&&s.length<80).slice(0,5),
          synonyms:synonyms.slice(0,6),antonyms:antonyms.slice(0,6),
          wordFamily:[],note:note.slice(0,500),trap:trap.slice(0,500),
          category:'پیش‌فرض',favorite:false,
          box:0,repetitions:0,interval:1,easeFactor:2.5,
          addedDate:new Date().toISOString(),nextReviewDate:null,lastReviewedAt:null,
          stability:0,difficulty:0,elapsedDays:0,scheduledDays:0,
